                      let W = geo.size.width
                      let H = geo.size.height
                      let vis = ed.visibleBoxes()
                      ZStack(alignment: .topLeading) {
                          ForEach(ed.proposals.indices, id: \.self) { i in
                              let r = uiRect(ed.proposals[i], W, H)

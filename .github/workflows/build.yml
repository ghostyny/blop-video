                  guard let removed = clips.first(where: { $0.id == id }) else { return }
                  clips.removeAll { $0.id == id }
                  _ = removed
                  let used = Set(clips.map { $0.srcID })
                  boxes.removeAll { !used.contains($0.srcID) }
                  if let sid = selectedBoxID, !boxes.contains(where: { $0.id == sid }) { selectedBoxID = nil }
                  selectedClipID = clips.first?.id
                  rebuild()
              }

              func move(_ i: Int, _ delta: Int) {
                  let j = i + delta
                  guard clips.indices.contains(i), clips.indices.contains(j) else { return }
                  clips.swapAt(i, j)
                  rebuild()
              }

              func muteAll(_ on: Bool) {
                  for i in clips.indices { clips[i].muted = on }
                  rebuild()
              }

              func deleteSelected() {
                  if let id = selectedBoxID, boxes.contains(where: { $0.id == id }) {
                      deleteBox(id)
                  } else if let id = selectedClipID {
                      removeClip(id)
                  }
              }

              func toggleMuteSelected() {
                  guard let i = clips.firstIndex(where: { $0.id == selectedClipID }) else { return }
                  clips[i].muted.toggle()
                  rebuild()
              }

              func retrackSelected() {
                  guard let id = selectedBoxID,
                        let r = visibleBoxes().first(where: { $0.box.id == id })?.rect else { return }
                  commitEdit(id, r)
              }

              // MARK: - Music

              func addMusic(_ src: URL) {
                  let ok = src.startAccessingSecurityScopedResource()
                  defer { if ok { src.stopAccessingSecurityScopedResource() } }
                  let ext = src.pathExtension.isEmpty ? "m4a" : src.pathExtension
                  let dest = Store.mediaDir.appendingPathComponent(UUID().uuidString + "." + ext)
                  do {
                      try FileManager.default.copyItem(at: src, to: dest)
                  } catch {
                      message = "Не удалось открыть файл: \(error.localizedDescription)"
                      return
                  }
                  let name = src.deletingPathExtension().lastPathComponent
                  Task { @MainActor in
                      let dur = (try? await AVURLAsset(url: dest).load(.duration).seconds) ?? 0
                      guard dur > 0.5 else {
                          self.message = "В этом файле нет звука"
                          return
                      }
                      self.music = Music(file: dest.lastPathComponent, name: name, dur: dur)
                      self.rebuild()
                  }
              }

              // MARK: - Boxes

              func visibleBoxes() -> [VisBox] {
                  guard let l = TL.loc(clips, currentTime) else { return [] }
                  var out: [VisBox] = []
                  for (i, b) in boxes.enumerated() where b.srcID == l.clip.srcID {
                      if let s = TL.sample(b, l.src) {
                          out.append(VisBox(index: i, box: b, rect: s.rect))
                      }
                  }
                  return out
              }

              func addBox(_ rect: CGRect) {
                  guard let l = TL.loc(clips, currentTime) else { return }
                  var b = Box(srcID: l.clip.srcID, startT: l.src)
                  b.samples = [Sample(t: l.src, rect: rect, alive: true)]
                  boxes.append(b)
                  selectedBoxID = b.id
                  retrack(b.id)
              }

              /// Рамку подвинули или растянули в текущем кадре: с этого момента пересчитываем трекинг.
              func commitEdit(_ id: UUID, _ rect: CGRect) {
                  guard let l = TL.loc(clips, currentTime),
                        let bi = boxes.firstIndex(where: { $0.id == id }),
                        boxes[bi].srcID == l.clip.srcID else { return }
                  let st = l.src
                  boxes[bi].samples.removeAll { $0.t >= st - 0.0005 }
                  boxes[bi].samples.append(Sample(t: st, rect: rect, alive: true))
                  if boxes[bi].startT > st { boxes[bi].startT = st }
                  if let h = boxes[bi].hideAfter, h <= st { boxes[bi].hideAfter = nil }
                  retrack(id)
              }

              func retrack(_ id: UUID) {
                  guard let b = built,
                        let bi = boxes.firstIndex(where: { $0.id == id }),
                        let l = TL.loc(clips, currentTime),
                        boxes[bi].srcID == l.clip.srcID,
                        let last = boxes[bi].samples.last else { return }
                  let t0 = l.start + (last.t - l.clip.inT)
                  let t1 = l.start + l.clip.dur
                  guard t1 - t0 > 0.05 else { return }
                  let rect = last.rect
                  let inT = l.clip.inT
                  let start = l.start
                  busy = true
                  Task { @MainActor in
                      let res: [Sample] = await Task.detached {
                          (try? Tracker.run(built: b, from: t0, to: t1, rect: rect,
                                            toSource: { inT + ($0 - start) })) ?? []
                      }.value
                      if let first = res.first, let k = self.boxes.firstIndex(where: { $0.id == id }) {
                          self.boxes[k].samples.removeAll { $0.t >= first.t - 0.0005 }
                          self.boxes[k].samples.append(contentsOf: res)
                      }
                      self.busy = false
                  }
              }

              func setStartHere(_ id: UUID) {
                  guard let l = TL.loc(clips, currentTime),
                        let bi = boxes.firstIndex(where: { $0.id == id }),
                        boxes[bi].srcID == l.clip.srcID else { return }
                  boxes[bi].startT = l.src
                  if let h = boxes[bi].hideAfter, h < l.src { boxes[bi].hideAfter = nil }
                  if boxes[bi].fx.has(.beep) { rebuild() }
              }

              func setEndHere(_ id: UUID) {
                  guard let l = TL.loc(clips, currentTime),
                        let bi = boxes.firstIndex(where: { $0.id == id }),
                        boxes[bi].srcID == l.clip.srcID else { return }
                  boxes[bi].hideAfter = max(l.src, boxes[bi].startT)
              }


              func clearEnd(_ id: UUID) {
                  guard let bi = boxes.firstIndex(where: { $0.id == id }) else { return }
                  boxes[bi].hideAfter = nil
              }

              func deleteBox(_ id: UUID) {
                  let hadBeep = boxes.first(where: { $0.id == id })?.fx.has(.beep) ?? false
                  if selectedBoxID == id { selectedBoxID = nil }   // сначала убираем панель, потом данные
                  boxes.removeAll { $0.id == id }
                  if hadBeep { rebuild() }
              }

              func jump(toBox b: Box) {
                  var s = 0.0
                  for c in clips {
                      if c.srcID == b.srcID && b.startT >= c.inT && b.startT <= c.outT {
                          seek(s + (b.startT - c.inT) + 0.001)
                          return
                      }
                      s += c.dur
                  }
              }

              func detect(_ mode: DetectMode) {
                  pause()
                  let t = currentTime
                  Task { @MainActor in
                      guard let cg = await self.frameImage(at: t) else { return }
                      let r = await Task.detached { Detector.detect(cg, mode: mode) }.value
                      self.proposals = r
                  }
              }

              // MARK: - Effects

              private func beepTimes() -> [Double] {
                  var out: [Double] = []
                  for b in boxes where b.fx.has(.beep) {
                      if let sp = boxSpan(b) { out.append(sp.0) }
                  }
                  return out.sorted()
              }

              /// Кадр без рамок: из него пикселизация в превью берёт цвета (пока видео стоит).
              func refreshBase() {
                  let need = boxes.contains(where: { $0.fx.has(.pixel) }) || (useBlobs && blob.fx.has(.pixel))
                  guard need, !isPlaying else {
                      if baseFrame != nil { baseFrame = nil }
                      return
                  }
                  let t = currentTime
                  baseGen += 1
                  let g = baseGen
                  Task { @MainActor in
                      let img = await self.frameImage(at: t)
                      if g == self.baseGen { self.baseFrame = img }
                  }
              }

              func toggleFX(_ id: UUID, _ k: FXKind) {
                  guard let i = boxes.firstIndex(where: { $0.id == id }) else { return }
                  boxes[i].fx.toggle(k)
                  if k == .beep { rebuild() }
                  if k == .pixel { refreshBase() }
              }

              func setFX(_ id: UUID, _ s: Set<FXKind>) {
                  guard let i = boxes.firstIndex(where: { $0.id == id }) else { return }
                  boxes[i].fx.on = s
                  rebuild()
              }

              func copyFX(from id: UUID) {
                  guard let b = boxes.first(where: { $0.id == id }), !b.fx.on.isEmpty else { return }
                  fxClipboard = b.fx
              }

              func pasteFX(to id: UUID) {
                  guard let c = fxClipboard else { return }
                  setFX(id, c.on)
              }

              func copyFXToAll(from id: UUID) {
                  guard let src = boxes.first(where: { $0.id == id }) else { return }
                  for i in boxes.indices { boxes[i].fx = src.fx }
                  rebuild()
              }

              func applyShapeToAll(from id: UUID) {
                  guard let b = boxes.first(where: { $0.id == id }) else { return }
                  for i in boxes.indices {
                      boxes[i].shape = b.shape
                      boxes[i].hand = b.hand
                  }
              }

              // MARK: - Blobs

              func refreshBlobs() {
                  refreshBase()
                  guard useBlobs else {
                      blobRects = []
                      return
                  }
                  if isPlaying { return }
                  let t = currentTime
                  let s = blob
                  blobGen += 1
                  let g = blobGen
                  Task { @MainActor in
                      guard let cg = await self.frameImage(at: t) else { return }
                      let r = await Task.detached { BlobDetector.detect(image: cg, settings: s) }.value
                      if g == self.blobGen { self.blobRects = r }
                  }
              }

              func pickColor(nx: Double, ny: Double) {
                  guard blob.kind == .color else { return }
                  let t = currentTime
                  Task { @MainActor in
                      guard let cg = await self.frameImage(at: t),
                            let c = BlobDetector.pickColor(image: cg, nx: nx, ny: ny) else { return }
                      self.blob.tr = c.0
                      self.blob.tg = c.1
                      self.blob.tb = c.2
                  }
              }

              // MARK: - Export

              func export() {
                  guard let b = built, !exporting else { return }
                  pause()
                  exporting = true
                  progress = 0
                  resultURL = nil
                  let cl = clips
                  let bx = boxes
                  let bs: BlobSettings? = useBlobs ? blob : nil
                  let m = music
                  let target = Editor.exportSize(renderSize, quality)
                  let base = renderSize
                  let bp = beepTimes()
                  Task { @MainActor in
                      do {
                          var bt = b
                          if target != base {
                              bt = try await Builder.build(clips: cl, music: m, render: target, beeps: bp)
                          }
                          let url = try await VideoExporter().run(built: bt, clips: cl, boxes: bx, blobs: bs) { p in
                              DispatchQueue.main.async { self.progress = p }
                          }
                          self.resultURL = url
                      } catch {
                          self.message = error.localizedDescription
                      }
                      self.exporting = false
                  }
              }

              static func exportSize(_ base: CGSize, _ short: Int) -> CGSize {
                  let s = Double(min(base.width, base.height))
                  guard s > 0 else { return base }
                  let k = Double(short) / s
                  let w = max(2, Int(Double(base.width) * k) & ~1)
                  let h = max(2, Int(Double(base.height) * k) & ~1)
                  return CGSize(width: w, height: h)
              }

              func saveToPhotos(_ url: URL) {
                  PHPhotoLibrary.requestAuthorization(for: .addOnly) { status in
                      guard status == .authorized || status == .limited else {
                          DispatchQueue.main.async { self.message = "Нет доступа к галерее" }
                          return
                      }
                      PHPhotoLibrary.shared().performChanges({
                          PHAssetChangeRequest.creationRequestForAssetFromVideo(atFileURL: url)
                      }) { ok, _ in
                          DispatchQueue.main.async { self.message = ok ? "Сохранено в галерею" : "Не удалось сохранить" }
                      }
                  }
              }
          }
          __BT_END__

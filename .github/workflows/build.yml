          import SwiftUI
          import PhotosUI

          /// Таймлайн: курсор стоит по центру, дорожки двигаются под ним.
          /// Тянешь пальцем влево/вправо, чтобы перематывать.
          struct EditorTimeline: View {
              @ObservedObject var ed: Editor
              let zoom: Double
              @Binding var pickerItem: PhotosPickerItem?
              let onMusicTap: () -> Void
              let onBoxTap: () -> Void

              @State private var dragStart: Double?

              init(ed: Editor, zoom: Double, pickerItem: Binding<PhotosPickerItem?>,
                   onMusicTap: @escaping () -> Void, onBoxTap: @escaping () -> Void) {
                  _ed = ObservedObject(wrappedValue: ed)
                  self.zoom = zoom
                  _pickerItem = pickerItem
                  self.onMusicTap = onMusicTap
                  self.onBoxTap = onBoxTap
              }

              private let basePPS: Double = 40
              private var pps: Double { basePPS * zoom }
              private let rulerH: CGFloat = 22
              private let timeH: CGFloat = 28
              private let videoH: CGFloat = 56
              private let musicH: CGFloat = 36
              private let laneH: CGFloat = 28
              private let gap: CGFloat = 8

              private struct BoxPill: Identifiable {
                  var id: UUID
                  var lane: Int
                  var a: Double
                  var e: Double
                  var box: Box
              }

              var body: some View {
                  GeometryReader { geo in
                      let gw = geo.size.width
                      let cx = gw / 2
                      let t = ed.currentTime
                      let originX = cx - CGFloat(t * pps)
                      let tracksTop = rulerH + timeH

                      ZStack(alignment: .topLeading) {
                          ruler(t: t)
                              .frame(width: gw, height: rulerH)

                          VStack(alignment: .leading, spacing: gap) {
                              videoTrack(gw: gw)
                              musicTrack(gw: gw)
                              boxTracks()
                          }
                          .offset(x: originX, y: tracksTop)

                          Text(timecode(t))
                              .font(.system(size: 20, weight: .semibold).monospacedDigit())
                              .foregroundStyle(.white)
                              .padding(.horizontal, 6)
                              .background(Theme.bg)
                              .position(x: cx, y: rulerH + timeH / 2)
                              .allowsHitTesting(false)

                          Rectangle()
                              .fill(Color.white)
                              .frame(width: 2, height: rulerH)
                              .position(x: cx, y: rulerH / 2)
                              .allowsHitTesting(false)

                          Rectangle()
                              .fill(Color.white)
                              .frame(width: 2, height: max(0, geo.size.height - tracksTop + 4))
                              .position(x: cx, y: tracksTop - 4 + max(0, geo.size.height - tracksTop + 4) / 2)
                              .allowsHitTesting(false)
                      }
                      .frame(width: gw, height: geo.size.height, alignment: .topLeading)
                      .clipped()
                      .contentShape(Rectangle())
                      .simultaneousGesture(
                          DragGesture(minimumDistance: 6)
                              .onChanged { v in
                                  if dragStart == nil {
                                      dragStart = ed.currentTime
                                      ed.pause()
                                      ed.scrubbing = true
                                  }
                                  ed.seek((dragStart ?? 0) - Double(v.translation.width) / pps)
                              }
                              .onEnded { _ in
                                  dragStart = nil
                                  ed.scrubbing = false
                              }
                      )
                  }
              }

              // MARK: - Ruler

              private func tickStep() -> Double {
                  for s in [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 30] where s * pps >= 8 {
                      return s
                  }
                  return 60
              }

              private func ruler(t: Double) -> some View {
                  let total = ed.total
                  let pps = self.pps
                  let step = tickStep()
                  return Canvas { ctx, size in
                      let cx = size.width / 2
                      let half = Double(cx) / pps
                      let tMin = max(0, t - half)
                      let tMax = min(total, t + half)
                      if tMax >= tMin {
                          let every = max(1, Int((1.0 / step).rounded()))
                          var k = Int(floor(tMin / step))
                          while Double(k) * step <= tMax + 1e-6 {
                              let s = Double(k) * step
                              if s >= -1e-6 {
                                  let x = cx + CGFloat((s - t) * pps)
                                  let major = step >= 1 ? (k % 5 == 0) : (k % every == 0)
                                  let h: CGFloat = major ? 15 : 8
                                  var p = Path()
                                  p.move(to: CGPoint(x: x, y: 0))
                                  p.addLine(to: CGPoint(x: x, y: h))
                                  ctx.stroke(p, with: .color(.white.opacity(major ? 0.7 : 0.35)), lineWidth: 1)
                              }
                              k += 1
                          }
                      }
                      let x0 = cx + CGFloat((0 - t) * pps)
                      if x0 > -4 && x0 < size.width + 4 {
                          ctx.fill(Path(CGRect(x: x0 - 1, y: 0, width: 3, height: 16)), with: .color(Theme.accent))
                      }
                  }
              }

              private func timecode(_ t: Double) -> String {
                  let tt = max(0, t)
                  let m = Int(tt) / 60
                  let s = Int(tt) % 60
                  let f = Int((tt - floor(tt)) * 30)
                  return String(format: "%02d:%02d:%02d", m, s, f)
              }

              // MARK: - Tracks

              private func pill(_ icon: String, _ title: String, width: CGFloat, height: CGFloat) -> some View {
                  HStack(spacing: 10) {
                      Image(systemName: icon)
                          .font(.system(size: 16, weight: .semibold))
                      Text(title)
                          .font(.system(size: 15, weight: .semibold).italic())
                          .lineLimit(1)
                  }
                  .foregroundStyle(Color.white.opacity(0.75))
                  .padding(.horizontal, 12)
                  .frame(width: width, height: height, alignment: .leading)
                  .background(Theme.track, in: RoundedRectangle(cornerRadius: 12, style: .continuous))
              }

              @ViewBuilder
              private func videoTrack(gw: CGFloat) -> some View {
                  if ed.clips.isEmpty {
                      PhotosPicker(selection: $pickerItem, matching: .videos) {
                          pill("play.rectangle", "Добавить видео", width: gw / 2 - 12, height: videoH)
                      }
                      .buttonStyle(.plain)
                  } else {
                      HStack(spacing: 0) {
                          ForEach(ed.clips) { c in
                              clipView(c)
                          }
                      }
                  }
              }

              private func clipView(_ c: Clip) -> some View {
                  let w = max(20, CGFloat(c.dur * pps))
                  let maxTiles = 40
                  let tileW = max(videoH, w / CGFloat(maxTiles))
                  let n = max(1, Int(ceil(w / tileW)))
                  let selected = c.id == ed.selectedClipID
                  return HStack(spacing: 0) {
                      ForEach(0..<n, id: \.self) { k in
                          let ts = min(c.outT - 0.05, c.inT + (Double(k) + 0.5) * Double(tileW) / pps)
                          ThumbTile(file: c.file, time: max(c.inT, ts), width: tileW, height: videoH)
                      }
                  }
                  .frame(width: w, height: videoH, alignment: .leading)
                  .clipShape(RoundedRectangle(cornerRadius: 10, style: .continuous))
                  .overlay(alignment: .topLeading) {
                      if c.muted {
                          Image(systemName: "speaker.slash.fill")
                              .font(.system(size: 11, weight: .bold))
                              .padding(5)
                              .background(Color.black.opacity(0.55), in: Circle())
                              .padding(4)
                      }
                  }
                  .overlay(
                      RoundedRectangle(cornerRadius: 10, style: .continuous)
                          .stroke(selected ? Theme.accent : Color.black.opacity(0.6), lineWidth: selected ? 2.5 : 1)
                  )
                  .contentShape(Rectangle())
                  .onTapGesture { ed.selectedClipID = c.id }
              }

              @ViewBuilder
              private func musicTrack(gw: CGFloat) -> some View {
                  if let m = ed.music {
                      let w = max(14, CGFloat(max(0, min(m.dur - m.inT, ed.total - m.start)) * pps))
                      ZStack(alignment: .topLeading) {
                          HStack(spacing: 8) {
                              Image(systemName: "music.note").font(.system(size: 13, weight: .bold))
                              Text(m.name).font(.system(size: 13, weight: .semibold)).lineLimit(1)
                          }
                          .padding(.horizontal, 10)
                          .frame(width: w, height: musicH, alignment: .leading)
                          .background(Theme.accent.opacity(0.22), in: RoundedRectangle(cornerRadius: 10, style: .continuous))
                          .overlay(RoundedRectangle(cornerRadius: 10, style: .continuous).stroke(Theme.accent.opacity(0.8), lineWidth: 1))
                          .foregroundStyle(Theme.accent)
                          .offset(x: CGFloat(m.start * pps))
                          .onTapGesture { onMusicTap() }
                      }
                      .frame(width: max(1, CGFloat(ed.total * pps)), height: musicH, alignment: .topLeading)
                  } else {
                      Button(action: onMusicTap) {
                          pill("music.note", "Добавить музыку", width: gw / 2 - 12, height: musicH)
                      }
                      .buttonStyle(.plain)
                  }
              }

              private func pills() -> [BoxPill] {
                  var items: [(Box, Double, Double)] = []
                  for b in ed.boxes {
                      if let sp = ed.boxSpan(b) { items.append((b, sp.0, sp.1)) }
                  }
                  items.sort { $0.1 < $1.1 }
                  var laneEnds: [Double] = []
                  var out: [BoxPill] = []
                  for (b, a, e) in items {
                      var lane = laneEnds.firstIndex(where: { $0 <= a + 0.001 }) ?? -1
                      if lane < 0 {
                          laneEnds.append(e)
                          lane = laneEnds.count - 1
                      } else {
                          laneEnds[lane] = e
                      }
                      out.append(BoxPill(id: b.id, lane: lane, a: a, e: e, box: b))
                  }
                  return out
              }

              @ViewBuilder
              private func boxTracks() -> some View {
                  let ps = pills()
                  if !ps.isEmpty {
                      let lanes = (ps.map { $0.lane }.max() ?? 0) + 1
                      ZStack(alignment: .topLeading) {
                          ForEach(ps) { p in
                              let selected = ed.selectedBoxID == p.id
                              let col = p.box.color.ui
                              RoundedRectangle(cornerRadius: 8, style: .continuous)
                                  .fill(col.opacity(0.28))
                                  .overlay(
                                      RoundedRectangle(cornerRadius: 8, style: .continuous)
                                          .stroke(col, lineWidth: selected ? 2.5 : 1.2)
                                  )
                                  .overlay(alignment: .leading) {
                                      Text(p.box.label.isEmpty ? "Рамка" : p.box.label)
                                          .font(.system(size: 11, weight: .semibold))
                                          .foregroundStyle(.white)
                                          .lineLimit(1)
                                          .padding(.horizontal, 6)
                                  }
                                  .frame(width: max(18, CGFloat((p.e - p.a) * pps)), height: laneH - 4)
                                  .offset(x: CGFloat(p.a * pps), y: CGFloat(p.lane) * laneH)
                                  .onTapGesture {
                                      ed.selectedBoxID = p.id
                                      ed.jump(toBox: p.box)
                                      onBoxTap()
                                  }
                          }
                      }
                      .frame(width: max(1, CGFloat(ed.total * pps)), height: CGFloat(lanes) * laneH, alignment: .topLeading)
                  }
              }
          }

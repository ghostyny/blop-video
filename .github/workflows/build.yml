          import SwiftUI
          import AVFoundation
          import Photos
          import Combine

          struct VisBox {
              let index: Int
              let box: Box
              let rect: CGRect
          }

          final class Editor: ObservableObject {
              @Published var clips: [Clip] = []
              @Published var boxes: [Box] = []
              @Published var music: Music?
              @Published var blob = BlobSettings() { didSet { refreshBlobs() } }
              @Published var useBlobs = false { didSet { refreshBlobs() } }
              @Published var renderSize = CGSize(width: 1080, height: 1920)
              @Published var currentTime = 0.0
              @Published var isPlaying = false
              @Published var selectedBoxID: UUID?
              @Published var selectedClipID: UUID?
              @Published var proposals: [CGRect] = []
              @Published var blobRects: [CGRect] = []
              @Published var baseFrame: CGImage?
              @Published var fxClipboard: BoxFX?     // скопированные эффекты рамки
              @Published var busy = false
              @Published var exporting = false
              @Published var progress = 0.0
              @Published var resultURL: URL?
              @Published var message: String?
              @Published var quality = 1080          // короткая сторона итогового видео
              @Published var canUndo = false
              @Published var canRedo = false

              let player = AVPlayer()
              let videoOutput = AVPlayerItemVideoOutput(pixelBufferAttributes: [
                  kCVPixelBufferPixelFormatTypeKey as String: Int(kCVPixelFormatType_32BGRA)
              ])
              var built: Built?
              var scrubbing = false

              private var timeObs: Any?
              private var bag = Set<AnyCancellable>()
              private var rebuildTask: Task<Void, Never>?
              private var lastFrame: (Double, CGImage)?
              private var blobGen = 0
              private var baseGen = 0
              private var history: [Data] = []
              private var histIdx = 0

              private struct Snap: Codable {
                  var clips: [Clip]
                  var boxes: [Box]
                  var music: Music?
              }

              var total: Double { TL.total(clips) }

              init() {
                  load()
                  cleanupMedia()
                  if let d = snapshot() { history = [d] }

                  timeObs = player.addPeriodicTimeObserver(
                      forInterval: CMTime(value: 1, timescale: 30), queue: .main
                  ) { [weak self] t in
                      self?.tick(t.seconds)
                  }
                  NotificationCenter.default.addObserver(
                      forName: .AVPlayerItemDidPlayToEndTime, object: nil, queue: .main
                  ) { [weak self] _ in
                      self?.isPlaying = false
                  }
                  objectWillChange
                      .debounce(for: .seconds(1), scheduler: DispatchQueue.main)
                      .sink { [weak self] _ in self?.save() }
                      .store(in: &bag)
                  Publishers.CombineLatest3($clips, $boxes, $music)
                      .debounce(for: .seconds(0.4), scheduler: DispatchQueue.main)
                      .sink { [weak self] _, _, _ in self?.commitSnapshot() }
                      .store(in: &bag)

                  rebuild()
              }

              // MARK: - Project file

              private func load() {
                  guard let data = try? Data(contentsOf: Store.projectURL),
                        let p = try? JSONDecoder().decode(ProjectData.self, from: data) else { return }
                  clips = p.clips.filter {
                      FileManager.default.fileExists(atPath: Store.mediaDir.appendingPathComponent($0.file).path)
                  }
                  let used = Set(clips.map { $0.srcID })
                  boxes = p.boxes.filter { used.contains($0.srcID) }
                  if let m = p.music,
                     FileManager.default.fileExists(atPath: Store.mediaDir.appendingPathComponent(m.file).path) {
                      music = m
                  }
                  blob = p.blob
                  useBlobs = p.useBlobs
                  renderSize = CGSize(width: p.rw, height: p.rh)
                  selectedClipID = clips.first?.id
              }

              func save() {
                  let p = ProjectData(clips: clips, boxes: boxes, music: music, blob: blob,
                                      useBlobs: useBlobs, rw: Double(renderSize.width), rh: Double(renderSize.height))
                  if let d = try? JSONEncoder().encode(p) {
                      try? d.write(to: Store.projectURL, options: .atomic)
                  }
              }

              // MARK: - History

              private func snapshot() -> Data? {
                  try? JSONEncoder().encode(Snap(clips: clips, boxes: boxes, music: music))
              }

              private func updateUndoFlags() {
                  canUndo = histIdx > 0
                  canRedo = histIdx < history.count - 1
              }

              func commitSnapshot() {
                  guard let d = snapshot() else { return }
                  if histIdx < history.count, history[histIdx] == d { return }
                  if histIdx < history.count - 1 { history.removeSubrange((histIdx + 1)...) }
                  history.append(d)
                  if history.count > 40 { history.removeFirst() }
                  histIdx = history.count - 1
                  updateUndoFlags()
              }

              func undo() {
                  commitSnapshot()
                  guard histIdx > 0 else { return }
                  histIdx -= 1
                  restore(history[histIdx])
              }

              func redo() {
                  guard histIdx < history.count - 1 else { return }
                  histIdx += 1
                  restore(history[histIdx])
              }

              private func restore(_ d: Data) {
                  guard let s = try? JSONDecoder().decode(Snap.self, from: d) else { return }
                  pause()
                  clips = s.clips
                  boxes = s.boxes
                  music = s.music
                  if let sid = selectedBoxID, !boxes.contains(where: { $0.id == sid }) { selectedBoxID = nil }
                  if !clips.contains(where: { $0.id == selectedClipID }) { selectedClipID = clips.first?.id }
                  updateUndoFlags()
                  rebuild()
              }

              /// Удаляет из Media файлы, которых нет в проекте (удалённые клипы нужны для undo до перезапуска).
              private func cleanupMedia() {
                  var used = Set(clips.map { $0.file })
                  if let m = music { used.insert(m.file) }
                  let fm = FileManager.default
                  let files = (try? fm.contentsOfDirectory(atPath: Store.mediaDir.path)) ?? []
                  for f in files where !used.contains(f) {
                      try? fm.removeItem(at: Store.mediaDir.appendingPathComponent(f))
                  }
              }

              func newProject() {
                  pause()
                  clips = []
                  boxes = []
                  music = nil
                  selectedBoxID = nil
                  selectedClipID = nil
                  proposals = []
                  blobRects = []
                  currentTime = 0
                  rebuild()
                  commitSnapshot()
              }

              // MARK: - Composition / player

              func rebuild() {
                  rebuildTask?.cancel()
                  pause()
                  lastFrame = nil
                  let c = clips
                  let m = music
                  let r = renderSize
                  let bp = beepTimes()

                  guard !c.isEmpty else {
                      built = nil
                      player.currentItem?.remove(videoOutput)
                      player.replaceCurrentItem(with: nil)
                      currentTime = 0
                      blobRects = []
                      return
                  }

                  rebuildTask = Task { @MainActor in
                      do {
                          let b = try await Builder.build(clips: c, music: m, render: r, beeps: bp)
                          if Task.isCancelled { return }
                          self.built = b
                          let item = AVPlayerItem(asset: b.comp)
                          item.videoComposition = b.vcomp
                          item.audioMix = b.mix
                          self.player.currentItem?.remove(self.videoOutput)
                          item.add(self.videoOutput)
                          self.player.replaceCurrentItem(with: item)
                          let keep = min(self.currentTime, max(0, b.duration - 0.001))
                          self.currentTime = keep
                          self.player.seek(to: CMTime(seconds: keep, preferredTimescale: 600),
                                           toleranceBefore: .zero, toleranceAfter: .zero,
                                           completionHandler: { _ in })
                          self.refreshBlobs()
                      } catch {
                          self.message = error.localizedDescription
                      }
                  }
              }

              private func tick(_ t: Double) {
                  if scrubbing || abs(t - currentTime) < 0.001 { return }
                  currentTime = t
                  if isPlaying && useBlobs {
                      let it = player.currentTime()
                      if let pb = videoOutput.copyPixelBuffer(forItemTime: it, itemTimeForDisplay: nil) {
                          blobRects = BlobDetector.detect(pixelBuffer: pb, settings: blob)
                      }
                  }
              }

              func togglePlay() {
                  if isPlaying {
                      pause()
                      return
                  }
                  guard built != nil else { return }
                  if currentTime >= total - 0.05 { seek(0) }
                  proposals = []
                  baseFrame = nil
                  player.play()
                  isPlaying = true
              }

              func pause() {
                  guard isPlaying else { return }
                  player.pause()
                  isPlaying = false
                  refreshBlobs()
              }

              func seek(_ t: Double) {
                  let tt = min(max(0, t), max(0, total - 0.001))
                  currentTime = tt
                  proposals = []
                  player.seek(to: CMTime(seconds: tt, preferredTimescale: 600),
                              toleranceBefore: .zero, toleranceAfter: .zero)
                  refreshBlobs()
              }

              func starts() -> [Double] {
                  var out: [Double] = []
                  var s = 0.0
                  for c in clips {
                      out.append(s)
                      s += c.dur
                  }
                  return out
              }

              func jumpPrev() {
                  let pts = starts() + [total]
                  if let p = pts.last(where: { $0 < currentTime - 0.05 }) { seek(p) } else { seek(0) }
              }

              func jumpNext() {
                  let pts = starts() + [total]
                  if let n = pts.first(where: { $0 > currentTime + 0.05 }) { seek(n) }
              }

              /// Где рамка живёт на таймлайне: (начало, конец) в секундах таймлайна.
              func boxSpan(_ b: Box) -> (Double, Double)? {
                  var s = 0.0
                  for c in clips {
                      if c.srcID == b.srcID && b.startT >= c.inT - 0.001 && b.startT <= c.outT + 0.001 {
                          let lastT = (b.samples.last?.t ?? b.startT) + 0.12
                          let endSrc = min(min(b.hideAfter ?? .infinity, lastT), c.outT)
                          let a = s + (b.startT - c.inT)
                          let e = s + (endSrc - c.inT)
                          return (a, max(e, a + 0.1))
                      }
                      s += c.dur
                  }
                  return nil
              }

              @MainActor
              func frameImage(at t: Double) async -> CGImage? {
                  guard let b = built else { return nil }
                  if let c = lastFrame, abs(c.0 - t) < 0.001 { return c.1 }
                  let gen = AVAssetImageGenerator(asset: b.comp)
                  gen.videoComposition = b.vcomp
                  gen.requestedTimeToleranceBefore = .zero
                  gen.requestedTimeToleranceAfter = .zero
                  let tt = min(max(0, t), max(0, b.duration - 0.05))
                  guard let res = try? await gen.image(at: CMTime(seconds: tt, preferredTimescale: 600)) else { return nil }
                  lastFrame = (t, res.image)
                  return res.image
              }

              // MARK: - Clips

              func addVideo(_ url: URL) {
                  Task { @MainActor in
                      let asset = AVURLAsset(url: url)
                      do {
                          guard let tr = try await asset.loadTracks(withMediaType: .video).first else {
                              self.message = "В файле нет видео"
                              return
                          }
                          let range = try await tr.load(.timeRange)
                          let assetDur = try await asset.load(.duration).seconds
                          let dur = min(assetDur, range.end.seconds)
                          if self.clips.isEmpty {
                              let n = try await tr.load(.naturalSize)
                              let pt = try await tr.load(.preferredTransform)
                              let r = CGRect(origin: .zero, size: n).applying(pt)
                              var w = abs(r.width)
                              var h = abs(r.height)
                              let k = min(1, 1920 / max(w, h))
                              w *= k
                              h *= k
                              self.renderSize = CGSize(width: max(2, Double(Int(w) & ~1)),
                                                       height: max(2, Double(Int(h) & ~1)))
                          }
                          let c = Clip(srcID: UUID(), file: url.lastPathComponent, srcDur: dur, inT: 0, outT: dur)
                          self.clips.append(c)
                          self.selectedClipID = c.id
                          self.rebuild()
                      } catch {
                          self.message = "Не удалось открыть видео: \(error.localizedDescription)"
                      }
                  }
              }

              func splitAtPlayhead() {
                  guard let l = TL.loc(clips, currentTime) else { return }
                  guard l.src - l.clip.inT > 0.15, l.clip.outT - l.src > 0.15 else {
                      message = "Поставь курсор внутри клипа, не у самого края"
                      return
                  }
                  var a = l.clip
                  a.outT = l.src
                  var b = l.clip
                  b.id = UUID()
                  b.inT = l.src
                  clips[l.idx] = a
                  clips.insert(b, at: l.idx + 1)
                  selectedClipID = b.id
                  rebuild()
              }

              func removeClip(_ id: UUID) {

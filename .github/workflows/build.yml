# BlobTracker Editor: весь проект в одном файле.
# Положи этот файл в репозиторий по пути .github/workflows/build.yml
# Сборка стартует сама после коммита. Готовый .ipa появится в разделе Releases.
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write


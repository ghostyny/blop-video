                                      RoundedRectangle(cornerRadius: 6)
                                          .stroke(c.id == ed.selectedClipID ? Color.blue : Color.white.opacity(0.4), lineWidth: 1.5)
                                      VStack(spacing: 2) {
                                          Text(String(format: "%.1f с", c.dur)).font(.caption2)
                                          if c.muted { Image(systemName: "speaker.slash.fill").font(.caption2) }
                                      }
                                  }
                                  .frame(width: max(24, CGFloat(c.dur) * pps), height: 52)
                                  .gesture(SpatialTapGesture().onEnded { v in
                                      ed.selectedClipID = c.id
                                      if starts.indices.contains(i) {
                                          ed.seek(starts[i] + Double(v.location.x / pps))
                                      }
                                  })
                              }
                          }
                          if let m = ed.music {
                              let w = CGFloat(max(0, min(m.dur - m.inT, ed.total - m.start))) * pps
                              RoundedRectangle(cornerRadius: 4)
                                  .fill(Color.purple.opacity(0.6))
                                  .frame(width: w, height: 14)
                                  .offset(x: CGFloat(m.start) * pps)
                          }
                      }
                      .overlay(alignment: .topLeading) {
                          Rectangle()
                              .fill(Color.white)
                              .frame(width: 2, height: 52)
                              .offset(x: CGFloat(ed.currentTime) * pps)
                              .allowsHitTesting(false)
                      }
                      .padding(.trailing, 40)
                  }
                  .frame(height: 76)
              }

              // MARK: - Tabs

              @ViewBuilder
              private var tabContent: some View {
                  switch tab {
                  case .clip: panel { clipTab }
                  case .boxes: panel { boxesTab }
                  case .blobs: panel { blobsTab }
                  case .audio: panel { audioTab }
                  }
              }

              private func panel<Content: View>(@ViewBuilder _ content: () -> Content) -> some View {
                  content()
                      .frame(maxWidth: .infinity, alignment: .leading)
                      .padding(12)
                      .background(Color.white.opacity(0.07), in: RoundedRectangle(cornerRadius: 12))
              }

              private var clipTab: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      HStack {
                          PhotosPicker(selection: $pickerItem, matching: .videos) {
                              Label("Добавить видео", systemImage: "plus.rectangle.on.rectangle")
                          }
                          .buttonStyle(.bordered)
                          Button { ed.splitAtPlayhead() } label: {
                              Label("Разрезать", systemImage: "scissors")
                          }
                          .buttonStyle(.bordered)
                          .disabled(ed.clips.isEmpty)
                      }

                      if let i = ed.clips.firstIndex(where: { $0.id == ed.selectedClipID }) {
                          HStack {
                              Button { ed.move(i, -1) } label: { Image(systemName: "arrow.left") }
                              Button { ed.move(i, 1) } label: { Image(systemName: "arrow.right") }
                              Button {
                                  ed.clips[i].muted.toggle()
                                  ed.rebuild()
                              } label: {
                                  Image(systemName: ed.clips[i].muted ? "speaker.slash.fill" : "speaker.wave.2.fill")
                              }
                              Spacer()
                              Button(role: .destructive) {
                                  ed.removeClip(ed.clips[i].id)
                              } label: {
                                  Image(systemName: "trash")
                              }
                          }
                          .buttonStyle(.bordered)

                          trimSlider("Начало клипа", $ed.clips[i].inT,
                                     0...max(0.1, ed.clips[i].outT - 0.2))
                          trimSlider("Конец клипа", $ed.clips[i].outT,
                                     (ed.clips[i].inT + 0.2)...max(ed.clips[i].inT + 0.3, ed.clips[i].srcDur))
                      } else {
                          Text("Тапни по клипу на таймлайне, чтобы обрезать, убрать звук или удалить.")
                              .font(.footnote)
                              .foregroundStyle(.secondary)
                      }
                  }
              }

              private func trimSlider(_ title: String, _ value: Binding<Double>, _ range: ClosedRange<Double>) -> some View {
                  VStack(alignment: .leading, spacing: 2) {
                      Text("\(title): \(String(format: "%.2f", value.wrappedValue)) с").font(.footnote)
                      Slider(value: value, in: range, onEditingChanged: { editing in
                          if !editing { ed.rebuild() }
                      })
                  }
              }

              private var boxesTab: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Text("Нарисуй рамку пальцем прямо на кадре: трекинг пойдёт от этого момента. Тап по рамке выбирает её. Тащи рамку или белую точку в углу: трекинг пересчитается с этого кадра.")
                          .font(.footnote)
                          .foregroundStyle(.secondary)

                      HStack {
                          Picker("Что искать", selection: $detectMode) {
                              ForEach(DetectMode.allCases) { Text($0.rawValue).tag($0) }
                          }
                          .pickerStyle(.menu)
                          Button("Найти на кадре") { ed.detect(detectMode) }
                              .buttonStyle(.bordered)
                              .disabled(ed.clips.isEmpty)
                      }

                      if !ed.boxes.isEmpty {
                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack {
                                  ForEach(Array(ed.boxes.enumerated()), id: \.element.id) { i, b in
                                      Button(b.label.isEmpty ? "Рамка \(i + 1)" : b.label) {
                                          ed.selectedBoxID = b.id
                                          ed.jump(toBox: b)
                                      }
                                      .buttonStyle(.bordered)
                                      .tint(ed.selectedBoxID == b.id ? Color.red : Color.gray)
                                  }
                              }
                          }
                      }

                      if let i = ed.boxes.firstIndex(where: { $0.id == ed.selectedBoxID }) {
                          let id = ed.boxes[i].id
                          TextField("Подпись (например: do you see him too?)", text: $ed.boxes[i].label)
                              .textFieldStyle(.roundedBorder)

                          HStack {
                              Button("OFFLINE") {
                                  ed.boxes[i].label = "OFFLINE"
                                  ed.boxes[i].color = .red
                                  ed.boxes[i].textColor = .red
                              }
                              Button("ONLINE") {
                                  ed.boxes[i].label = "ONLINE"
                                  ed.boxes[i].color = .green
                                  ed.boxes[i].textColor = .green
                              }
                              Spacer()
                          }
                          .buttonStyle(.bordered)

                          ColorRow(title: "Цвет рамки", selection: $ed.boxes[i].color)
                          ColorRow(title: "Цвет текста", selection: $ed.boxes[i].textColor)

                          HStack {
                              Button("Начало тут") { ed.setStartHere(id) }
                              Button("Конец тут") { ed.setEndHere(id) }
                              Button("Без конца") { ed.clearEnd(id) }
                          }
                          .buttonStyle(.bordered)
                          .font(.footnote)

                          HStack {
                              Button("Перетрекать отсюда") {
                                  if let r = ed.visibleBoxes().first(where: { $0.box.id == id })?.rect {
                                      ed.commitEdit(id, r)
                                  }
                              }
                              .buttonStyle(.bordered)
                              Spacer()
                              Button("Удалить рамку", role: .destructive) { ed.deleteBox(id) }
                                  .buttonStyle(.bordered)
                          }
                      }
                  }
              }

              private var blobsTab: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Toggle("Блобы включены (на всё видео)", isOn: $ed.useBlobs)

                      if ed.useBlobs {
                          Picker("Что ловить", selection: $ed.blob.kind) {
                              ForEach(BlobSettings.Kind.allCases) { Text($0.rawValue).tag($0) }
                          }
                          .pickerStyle(.segmented)

                          if ed.blob.kind == .color {
                              HStack {
                                  Text("Цвет:")
                                  Circle()
                                      .fill(Color(red: ed.blob.tr, green: ed.blob.tg, blue: ed.blob.tb))
                                      .frame(width: 22, height: 22)
                                  Text("тапни по кадру, чтобы выбрать")
                                      .font(.footnote)
                                      .foregroundStyle(.secondary)
                              }
                              sliderRow("Допуск цвета", $ed.blob.tolerance, 0.05...0.7)
                          } else {
                              sliderRow(ed.blob.kind == .bright ? "Порог яркости" : "Порог темноты",
                                        $ed.blob.threshold, 0.05...0.95)
                          }

                          sliderRow("Минимальный размер пятна", $ed.blob.minArea, 0.0003...0.05)
                          Stepper("Макс. рамок: \(ed.blob.maxBlobs)", value: $ed.blob.maxBlobs, in: 1...60)

                          TextField("Подписи через запятую (OFFLINE, ONLINE)", text: $ed.blob.labels)
                              .textFieldStyle(.roundedBorder)

                          ColorRow(title: "Цвет рамок", selection: $ed.blob.color)
                          ColorRow(title: "Цвет текста", selection: $ed.blob.textColor)
                      }
                  }
              }

              private func sliderRow(_ title: String, _ value: Binding<Double>, _ range: ClosedRange<Double>) -> some View {
                  VStack(alignment: .leading, spacing: 2) {
                      Text(title).font(.footnote)
                      Slider(value: value, in: range)
                  }
              }

              private var audioTab: some View {
                  VStack(alignment: .leading, spacing: 10) {
                      HStack {
                          Button { ed.muteAll(true) } label: {
                              Label("Убрать звук у видео", systemImage: "speaker.slash")
                          }
                          Button { ed.muteAll(false) } label: {
                              Label("Вернуть", systemImage: "speaker.wave.2")
                          }
                      }
                      .buttonStyle(.bordered)
                      .font(.footnote)

                      Button { showMusicPicker = true } label: {
                          Label(ed.music == nil ? "Добавить музыку" : "Заменить музыку", systemImage: "music.note")
                      }
                      .buttonStyle(.borderedProminent)

                      if let m = ed.music {
                          Text(m.name).font(.footnote).foregroundStyle(.secondary)
                          musicSlider("Громкость", \.volume, 0...1)
                          musicSlider("Фейд-ин, с", \.fadeIn, 0...5)
                          musicSlider("Фейд-аут, с", \.fadeOut, 0...5)
                          musicSlider("Старт на таймлайне, с", \.start, 0...max(0.1, ed.total))
                          musicSlider("Начать с секунды трека", \.inT, 0...max(0.1, m.dur - 1))
                          Button("Убрать музыку", role: .destructive) {
                              ed.music = nil
                              ed.rebuild()
                          }
                          .buttonStyle(.bordered)
                      }
                  }
              }

              private func musicSlider(_ title: String, _ kp: WritableKeyPath<Music, Double>,
                                       _ range: ClosedRange<Double>) -> some View {
                  VStack(alignment: .leading, spacing: 2) {
                      Text("\(title): \(String(format: "%.1f", ed.music?[keyPath: kp] ?? 0))").font(.footnote)
                      Slider(
                          value: Binding(
                              get: { ed.music?[keyPath: kp] ?? 0 },
                              set: { ed.music?[keyPath: kp] = $0 }
                          ),
                          in: range,
                          onEditingChanged: { editing in
                              if !editing { ed.rebuild() }
                          }
                      )
                  }
              }
          }

          struct ResultView: View {
              let url: URL
              let onSave: () -> Void
              @State private var player: AVPlayer

              init(url: URL, onSave: @escaping () -> Void) {
                  self.url = url
                  self.onSave = onSave
                  _player = State(initialValue: AVPlayer(url: url))
              }

              var body: some View {
                  VStack(spacing: 12) {
                      VideoPlayer(player: player)
                          .clipShape(RoundedRectangle(cornerRadius: 12))
                      HStack {
                          Button("Сохранить в галерею") { onSave() }
                              .buttonStyle(.borderedProminent)
                          ShareLink(item: url)
                      }
                  }
                  .padding()
              }
          }
          __BT_END__

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project BlobTracker.xcodeproj \
            -scheme BlobTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BlobTracker.app Payload/
          zip -r BlobTracker.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BlobTracker-ipa
          path: BlobTracker.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" BlobTracker.ipa \
            --title "BlobTracker build ${{ github.run_number }}" \
            --notes "Unsigned IPA. Install via AltStore, Sideloadly or TrollStore."

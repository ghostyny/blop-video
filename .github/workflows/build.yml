              // MARK: - Безопасные биндинги по id
              // Индекс в массиве после удаления устаревает, а SwiftUI ещё читает старые биндинги.
              // Поэтому ищем элемент по id при каждом обращении, а если его уже нет, отдаём запасное значение.

              private func boxBinding<T>(_ id: UUID, _ kp: WritableKeyPath<Box, T>, _ fallback: T) -> Binding<T> {
                  Binding(
                      get: { ed.boxes.first(where: { $0.id == id })?[keyPath: kp] ?? fallback },
                      set: { v in
                          if let i = ed.boxes.firstIndex(where: { $0.id == id }) { ed.boxes[i][keyPath: kp] = v }
                      }
                  )
              }

              private func clipBinding<T>(_ id: UUID, _ kp: WritableKeyPath<Clip, T>, _ fallback: T) -> Binding<T> {
                  Binding(
                      get: { ed.clips.first(where: { $0.id == id })?[keyPath: kp] ?? fallback },
                      set: { v in
                          if let i = ed.clips.firstIndex(where: { $0.id == id }) { ed.clips[i][keyPath: kp] = v }
                      }
                  )
              }

              private func mutateBox(_ id: UUID, _ f: (inout Box) -> Void) {
                  if let i = ed.boxes.firstIndex(where: { $0.id == id }) { f(&ed.boxes[i]) }
              }

              // MARK: - Panel: boxes

              private var boxesBody: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      HStack {
                          Menu {
                              Picker("Что искать", selection: $detectMode) {
                                  ForEach(DetectMode.allCases) { Text($0.rawValue).tag($0) }
                              }
                          } label: {
                              HStack(spacing: 6) {
                                  Text(detectMode.rawValue)
                                  Image(systemName: "chevron.down").font(.system(size: 11, weight: .bold))
                              }
                              .font(.system(size: 14, weight: .semibold))
                              .padding(.horizontal, 14)
                              .padding(.vertical, 9)
                              .background(Theme.tile, in: Capsule())
                              .overlay(Capsule().stroke(Theme.tileStroke, lineWidth: 1))
                          }
                          Button("Найти на кадре") { ed.detect(detectMode) }
                              .buttonStyle(ChipButtonStyle())
                              .disabled(ed.clips.isEmpty)
                          if ed.busy { ProgressView() }
                      }

                      if !ed.boxes.isEmpty {
                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack {
                                  ForEach(Array(ed.boxes.enumerated()), id: \.element.id) { i, b in
                                      Button(b.label.isEmpty ? "Рамка \(i + 1)" : b.label) {
                                          ed.selectedBoxID = b.id
                                          ed.jump(toBox: b)
                                      }
                                      .buttonStyle(ChipButtonStyle(selected: ed.selectedBoxID == b.id))
                                  }
                              }
                          }
                      }

                      HStack {
                          Button {
                              if let id = ed.selectedBoxID { ed.copyFX(from: id) }
                          } label: {
                              Label("Скопировать", systemImage: "doc.on.doc")
                          }
                          .buttonStyle(ChipButtonStyle())
                          .disabled(ed.boxes.first(where: { $0.id == ed.selectedBoxID })?.fx.on.isEmpty ?? true)

                          Button {
                              if let id = ed.selectedBoxID { ed.pasteFX(to: id) }
                          } label: {
                              Label(ed.fxClipboard.map { "Вставить (\($0.on.count))" } ?? "Вставить",
                                    systemImage: "doc.on.clipboard")
                          }
                          .buttonStyle(ChipButtonStyle(selected: ed.fxClipboard != nil))
                          .disabled(ed.fxClipboard == nil || ed.selectedBoxID == nil)

                          Spacer(minLength: 0)
                      }

                      if let id = ed.boxes.first(where: { $0.id == ed.selectedBoxID })?.id {
                          Picker("", selection: $boxTab) {
                              ForEach(BoxTab.allCases) { Text($0.rawValue).tag($0) }
                          }
                          .pickerStyle(.segmented)

                          switch boxTab {
                          case .look: lookBody(id)
                          case .fx: fxBody(id)
                          case .time: timeBody(id)
                          }
                      } else {
                          hint("Нарисуй рамку пальцем на кадре, трекинг пойдёт от этого момента. Потом выбери её здесь: подпись и цвет на вкладке «Вид», анимации на вкладке «Эффекты», начало и конец на вкладке «Время».")
                      }
                  }
              }

              @ViewBuilder
              private func lookBody(_ id: UUID) -> some View {
                  if let box = ed.boxes.first(where: { $0.id == id }) {
                      TextField("Подпись (например: do you see him too?)", text: boxBinding(id, \.label, ""))
                          .textFieldStyle(.roundedBorder)

                      HStack {
                          Button("OFFLINE") {
                              mutateBox(id) { $0.label = "OFFLINE"; $0.color = .red; $0.textColor = .red }
                          }
                          Button("ONLINE") {
                              mutateBox(id) { $0.label = "ONLINE"; $0.color = .green; $0.textColor = .green }
                          }
                          Spacer()
                          Button("Удалить") { ed.deleteBox(id) }
                              .buttonStyle(ChipButtonStyle(danger: true))
                      }
                      .buttonStyle(ChipButtonStyle())

                      ColorRow(title: "Цвет рамки", selection: boxBinding(id, \.color, RGB.red))
                      ColorRow(title: "Цвет текста", selection: boxBinding(id, \.textColor, RGB.red))
                      shapeControls(shape: boxBinding(id, \.shape, BoxShape.rect),
                                    hand: boxBinding(id, \.hand, HandStyle()),
                                    color: box.color)
                      if ed.boxes.count > 1 {
                          Button("Форму и стиль всем рамкам") { ed.applyShapeToAll(from: id) }
                              .buttonStyle(ChipButtonStyle())
                      }
                  }
              }

              @ViewBuilder
              private func fxBody(_ id: UUID) -> some View {
                  let on = ed.boxes.first(where: { $0.id == id })?.fx.on ?? []
                  HStack {
                      Button("Пакет из 5") { ed.setFX(id, BoxFX.pack) }
                      Button("Сбросить") { ed.setFX(id, []) }
                      Button("Всем рамкам") { ed.copyFXToAll(from: id) }
                      Spacer(minLength: 0)
                  }
                  .buttonStyle(ChipButtonStyle())

                  hint(on.isEmpty
                       ? "Выбери анимации: они сразу видны в превью, при воспроизведении тоже."
                       : "Включено: \(on.count). «Всем рамкам» копирует этот набор на остальные.")

                  fxGroups(FXKind.allCases, on: on) { k in ed.toggleFX(id, k) }
              }

              @ViewBuilder
              private func timeBody(_ id: UUID) -> some View {
                  let b = ed.boxes.first(where: { $0.id == id })
                  let hide: Double? = b?.hideAfter
                  let startTxt = String(format: "%.2f", b?.startT ?? 0)
                  let endTxt = hide.map { String(format: "%.2f с", $0) } ?? "нет"
                  hint("Поставь курсор на нужный кадр и нажми кнопку. Сейчас: начало \(startTxt) с, конец \(endTxt).")
                  HStack {
                      Button("Начало тут") { ed.setStartHere(id) }
                      Button("Конец тут") { ed.setEndHere(id) }
                      Button("Без конца") { ed.clearEnd(id) }
                  }
                  .buttonStyle(ChipButtonStyle())

                  Button("Перетрекать отсюда") { ed.retrackSelected() }
                      .buttonStyle(ChipButtonStyle())
              }

              /// Сетка включаемых эффектов по группам (для рамок и для блобов).
              private func fxGroups(_ kinds: [FXKind], on: Set<FXKind>,
                                    toggle: @escaping (FXKind) -> Void) -> some View {
                  VStack(alignment: .leading, spacing: 14) {
                      ForEach(FXGroup.allCases) { g in
                          let items = kinds.filter { $0.group == g }
                          if !items.isEmpty {
                              VStack(alignment: .leading, spacing: 6) {
                                  Text(g.rawValue)
                                      .font(.footnote.weight(.semibold))
                                      .foregroundStyle(.secondary)
                                  LazyVGrid(columns: [GridItem(.adaptive(minimum: 150), spacing: 8)],
                                            alignment: .leading, spacing: 8) {
                                      ForEach(items) { k in
                                          Button { toggle(k) } label: {
                                              Text(k.title)
                                                  .lineLimit(1)
                                                  .minimumScaleFactor(0.8)
                                                  .frame(maxWidth: .infinity)
                                          }
                                          .buttonStyle(ChipButtonStyle(selected: on.contains(k)))
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              // MARK: - Shape controls (форма и рисованная дрожь)

              private func shapeControls(shape: Binding<BoxShape>, hand: Binding<HandStyle>, color: RGB) -> some View {
                  VStack(alignment: .leading, spacing: 10) {
                      Text("Форма").font(.footnote)
                      ScrollView(.horizontal, showsIndicators: false) {
                          HStack {
                              ForEach(BoxShape.allCases) { s in
                                  Button(s.rawValue) { shape.wrappedValue = s }
                                      .buttonStyle(ChipButtonStyle(selected: shape.wrappedValue == s))
                              }
                          }
                      }
                      if shape.wrappedValue != .rect {
                          HandPreview(shape: shape.wrappedValue, style: hand.wrappedValue, color: color)
                              .frame(height: 120)
                              .frame(maxWidth: .infinity)
                              .background(Theme.tile, in: RoundedRectangle(cornerRadius: 12))
                          if shape.wrappedValue == .arrow {
                              valueSlider("Поворот стрелки",
                                          Binding(get: { hand.wrappedValue.angle }, set: { hand.wrappedValue.angle = $0 }),
                                          -180...180, format: "%.0f°")
                              HStack {
                                  ForEach([(0.0, "↑"), (90.0, "→"), (180.0, "↓"), (-90.0, "←")], id: \.0) { a in
                                      Button(a.1) { hand.wrappedValue.angle = a.0 }
                                          .buttonStyle(ChipButtonStyle(selected: hand.wrappedValue.angle == a.0))
                                  }
                                  Spacer(minLength: 0)
                              }
                          }
                          valueSlider("Кадров в секунду",
                                      Binding(get: { hand.wrappedValue.fps }, set: { hand.wrappedValue.fps = $0 }),
                                      3...24, format: "%.0f")
                          valueSlider("Дрожание",
                                      Binding(get: { hand.wrappedValue.jitter }, set: { hand.wrappedValue.jitter = $0 }),
                                      0...1.5)
                          valueSlider("Толщина",
                                      Binding(get: { hand.wrappedValue.width }, set: { hand.wrappedValue.width = $0 }),
                                      1...12, format: "%.1f")
                          Text("Вариантов кадров (∞ = без повторов)").font(.footnote)
                          Picker("", selection: Binding(get: { hand.wrappedValue.variants },
                                                        set: { hand.wrappedValue.variants = $0 })) {
                              ForEach([2, 3, 4, 6, 0], id: \.self) { n in
                                  Text(n == 0 ? "∞" : "\(n)").tag(n)
                              }
                          }
                          .pickerStyle(.segmented)
                          Toggle("Двойная линия",
                                 isOn: Binding(get: { hand.wrappedValue.twin }, set: { hand.wrappedValue.twin = $0 }))
                          hint("Цвет формы это «Цвет рамки». На видео дрожь видна при воспроизведении, а здесь она идёт всегда.")
                      }
                  }
              }

              // MARK: - Panel: blobs

              private var blobsBody: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Toggle("Блобы на всё видео", isOn: $ed.useBlobs)

                      if ed.useBlobs {
                          Picker("Что ловить", selection: $ed.blob.kind) {
                              ForEach(BlobSettings.Kind.allCases) { Text($0.rawValue).tag($0) }
                          }
                          .pickerStyle(.segmented)

                          if ed.blob.kind == .color {
                              HStack {
                                  Text("Цвет:")
                                  Circle()
                                      .fill(Color(red: ed.blob.tr, green: ed.blob.tg, blue: ed.blob.tb))
                                      .frame(width: 22, height: 22)
                                  hint("тапни по кадру, чтобы выбрать")
                              }
                              valueSlider("Допуск цвета", $ed.blob.tolerance, 0.05...0.7)
                          } else {
                              valueSlider(ed.blob.kind == .bright ? "Порог яркости" : "Порог темноты",
                                          $ed.blob.threshold, 0.05...0.95)
                          }

                          valueSlider("Минимальный размер пятна", $ed.blob.minArea, 0.0003...0.05, format: "%.4f")
                          Stepper("Макс. рамок: \(ed.blob.maxBlobs)", value: $ed.blob.maxBlobs, in: 1...60)

                          TextField("Подписи через запятую (OFFLINE, ONLINE)", text: $ed.blob.labels)
                              .textFieldStyle(.roundedBorder)

                          ColorRow(title: "Цвет рамок", selection: $ed.blob.color)
                          ColorRow(title: "Цвет текста", selection: $ed.blob.textColor)
                          shapeControls(shape: $ed.blob.shape, hand: $ed.blob.hand, color: ed.blob.color)

                          DisclosureGroup("Эффекты рамок", isExpanded: $blobFXOpen) {
                              fxGroups(FXKind.blobKinds, on: ed.blob.fx.on) { k in
                                  ed.blob.fx.toggle(k)
                                  if k == .pixel { ed.refreshBase() }
                              }
                              .padding(.top, 8)
                          }
                      }
                  }
              }

              // MARK: - Panel: trim

              @ViewBuilder
              private var trimBody: some View {
                  if let clip = ed.clips.first(where: { $0.id == ed.selectedClipID }),
                     let i = ed.clips.firstIndex(where: { $0.id == clip.id }) {
                      let cid = clip.id
                      HStack {
                          Button { ed.move(i, -1) } label: { Image(systemName: "arrow.left") }
                          Button { ed.move(i, 1) } label: { Image(systemName: "arrow.right") }
                          Button {
                              ed.toggleMuteSelected()
                          } label: {
                              Image(systemName: clip.muted ? "speaker.slash.fill" : "speaker.wave.2.fill")
                          }
                          Spacer()
                          Button { ed.removeClip(cid) } label: { Image(systemName: "trash") }
                              .buttonStyle(ChipButtonStyle(danger: true))
                      }
                      .buttonStyle(ChipButtonStyle())

                      valueSlider("Начало клипа", clipBinding(cid, \.inT, 0.0),
                                  0...max(0.1, clip.outT - 0.2), format: "%.2f с") { ed.rebuild() }
                      valueSlider("Конец клипа", clipBinding(cid, \.outT, 0.0),
                                  (clip.inT + 0.2)...max(clip.inT + 0.3, clip.srcDur),
                                  format: "%.2f с") { ed.rebuild() }
                  } else {
                      hint("Тапни по клипу на таймлайне, чтобы обрезать его, убрать звук или удалить.")
                  }
              }

              // MARK: - Panel: audio

              private var audioBody: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      HStack {
                          Button { ed.muteAll(true) } label: {
                              Label("Убрать звук у видео", systemImage: "speaker.slash")
                          }
                          Button { ed.muteAll(false) } label: {
                              Label("Вернуть", systemImage: "speaker.wave.2")
                          }
                      }
                      .buttonStyle(ChipButtonStyle())
                      .disabled(ed.clips.isEmpty)

                      Button { showMusicPicker = true } label: {
                          Label(ed.music == nil ? "Добавить музыку" : "Заменить музыку", systemImage: "music.note")
                      }
                      .buttonStyle(ChipButtonStyle(selected: true))

                      if let m = ed.music {
                          hint(m.name)
                          musicSlider("Громкость", \.volume, 0...1)
                          musicSlider("Фейд-ин, с", \.fadeIn, 0...5)
                          musicSlider("Фейд-аут, с", \.fadeOut, 0...5)
                          musicSlider("Старт на таймлайне, с", \.start, 0...max(0.1, ed.total))
                          musicSlider("Начать с секунды трека", \.inT, 0...max(0.1, m.dur - 1))
                          Button("Убрать музыку") {
                              ed.music = nil
                              ed.rebuild()
                          }
                          .buttonStyle(ChipButtonStyle(danger: true))
                      }
                  }
              }

              private func musicSlider(_ title: String, _ kp: WritableKeyPath<Music, Double>,
                                       _ range: ClosedRange<Double>) -> some View {
                  valueSlider(
                      title,
                      Binding(
                          get: { ed.music?[keyPath: kp] ?? 0 },
                          set: { ed.music?[keyPath: kp] = $0 }
                      ),
                      range,
                      format: "%.1f"
                  ) { ed.rebuild() }
              }
          }

          struct ResultView: View {
              let url: URL
              let onSave: () -> Void
              @State private var player: AVPlayer

              init(url: URL, onSave: @escaping () -> Void) {
                  self.url = url
                  self.onSave = onSave
                  _player = State(initialValue: AVPlayer(url: url))
              }

              var body: some View {
                  VStack(spacing: 12) {
                      VideoPlayer(player: player)
                          .clipShape(RoundedRectangle(cornerRadius: 12))
                      HStack {
                          Button("Сохранить в галерею") { onSave() }
                              .buttonStyle(.borderedProminent)
                          ShareLink(item: url)
                      }
                  }
                  .padding()
              }
          }
          __BT_END__

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project BlobTracker.xcodeproj \
            -scheme BlobTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BlobTracker.app Payload/
          zip -r BlobTracker.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: BlobTracker-ipa
          path: BlobTracker.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" BlobTracker.ipa \
            --title "BlobTracker build ${{ github.run_number }}" \
            --notes "Unsigned IPA. Install via AltStore, Sideloadly or TrollStore."

# BlobTracker Editor: весь проект в одном файле.
# Положи этот файл в репозиторий по пути .github/workflows/build.yml
# Сборка стартует сама после коммита. Готовый .ipa появится в разделе Releases.
name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          mkdir -p Sources
          cat > project.yml <<'__BT_END__'
          name: BlobTracker
          options:
            bundleIdPrefix: com.blobtracker
            deploymentTarget:
              iOS: "17.0"
          targets:
            BlobTracker:
              type: application
              platform: iOS
              sources:
                - path: Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.blobtracker.app
                  PRODUCT_NAME: BlobTracker
                  SWIFT_VERSION: "5.0"
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: BlobTracker
                  INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Сохранить готовое видео в галерею"
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  TARGETED_DEVICE_FAMILY: "1"
                  CODE_SIGNING_ALLOWED: NO
          __BT_END__
          cat > Sources/App.swift <<'__BT_END__'
          import SwiftUI

          @main
          struct BlobTrackerApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          __BT_END__
          cat > Sources/Models.swift <<'__BT_END__'
          import SwiftUI
          import UIKit
          import CoreTransferable
          import UniformTypeIdentifiers

          /// Любой цвет (для рамки и для текста).
          struct RGB: Equatable, Hashable, Codable {
              var r: Double
              var g: Double
              var b: Double

              init(_ r: Double, _ g: Double, _ b: Double) {
                  self.r = r
                  self.g = g
                  self.b = b
              }

              init(color: Color) {
                  var rr: CGFloat = 0, gg: CGFloat = 0, bb: CGFloat = 0, aa: CGFloat = 0
                  UIColor(color).getRed(&rr, green: &gg, blue: &bb, alpha: &aa)
                  self.init(Double(rr), Double(gg), Double(bb))
              }

              static let red = RGB(1.0, 0.05, 0.05)
              static let green = RGB(0.1, 1.0, 0.1)
              static let blue = RGB(0.25, 0.45, 1.0)
              static let yellow = RGB(1.0, 0.9, 0.0)
              static let white = RGB(1.0, 1.0, 1.0)
              static let cyan = RGB(0.0, 0.95, 1.0)
              static let magenta = RGB(1.0, 0.1, 0.8)
              static let orange = RGB(1.0, 0.55, 0.0)

              static let presets: [RGB] = [.red, .green, .blue, .yellow, .white, .cyan, .magenta, .orange]

              var ui: Color { Color(red: r, green: g, blue: b) }
              var cg: CGColor { CGColor(red: r, green: g, blue: b, alpha: 1) }
          }

          /// Одна точка трека рамки. t это время в ИСХОДНОМ видео (сек),
          /// rect нормализован (0...1), начало слева снизу, как в Vision.
          struct Sample: Codable, Hashable {
              var t: Double
              var rect: CGRect
              var alive: Bool
          }

          /// Эффекты рамки. Каждый считается только от времени и seed,
          /// поэтому в превью и в готовом видео они выглядят одинаково.
          enum FXGroup: String, CaseIterable, Identifiable {
              case question = "Знак вопроса"
              case frame = "Рамка"
              case text = "Подпись и данные"
              case scene = "Появление и кадр"
              var id: String { rawValue }
          }

          enum FXKind: String, CaseIterable, Codable, Identifiable {
              case flyQ, growQ, cornerQ, rainQ, doubt
              case lockOn, brackets, rgb, trail, scan, dashed, links
              case typing, data
              case vanish, pixel, spot, beep

              var id: String { rawValue }

              var title: String {
                  switch self {
                  case .flyQ: return "Вылетающие «?»"
                  case .growQ: return "Растущая подпись"
                  case .cornerQ: return "«?» на углу"
                  case .rainQ: return "Дождь из «?»"
                  case .doubt: return "Сомнение"
                  case .lockOn: return "Lock-on"
                  case .brackets: return "Скобки"
                  case .rgb: return "RGB-глитч"
                  case .trail: return "Шлейф"
                  case .scan: return "Сканлайн"
                  case .dashed: return "Пунктир"
                  case .links: return "Связи"
                  case .typing: return "Печать"
                  case .data: return "Данные"
                  case .vanish: return "Исчезновение"
                  case .pixel: return "Пикселизация"
                  case .spot: return "Spotlight"
                  case .beep: return "Писк"
                  }
              }

              var group: FXGroup {
                  switch self {
                  case .flyQ, .growQ, .cornerQ, .rainQ, .doubt: return .question
                  case .lockOn, .brackets, .rgb, .trail, .scan, .dashed, .links: return .frame
                  case .typing, .data: return .text
                  case .vanish, .pixel, .spot, .beep: return .scene
                  }
              }

              /// Что имеет смысл для блобов (у них нет возраста и истории движения).
              static let blobKinds: [FXKind] = [.flyQ, .cornerQ, .rainQ, .doubt, .brackets, .rgb,
                                                .scan, .dashed, .links, .data, .pixel, .spot]
          }

          struct BoxFX: Codable, Equatable {
              var on: Set<FXKind> = []

              func has(_ k: FXKind) -> Bool { on.contains(k) }

              mutating func toggle(_ k: FXKind) {
                  if on.contains(k) { on.remove(k) } else { on.insert(k) }
              }

              /// Быстрый набор: вылетающие «?», растущая подпись, lock-on, RGB-глитч, печать.
              static let pack: Set<FXKind> = [.flyQ, .growQ, .lockOn, .rgb, .typing]
          }

          /// Кусок видео на таймлайне.
          struct Clip: Identifiable, Codable {
              var id = UUID()
              var srcID: UUID        // общий для всех кусков, нарезанных из одного файла
              var file: String       // имя файла в Documents/Media
              var srcDur: Double
              var inT: Double
              var outT: Double
              var muted = false
              var dur: Double { outT - inT }
          }

          struct Box: Identifiable, Codable {
              var id = UUID()
              var srcID: UUID
              var startT: Double
              var hideAfter: Double? = nil
              var label = ""
              var color: RGB = .red
              var textColor: RGB = .red
              var samples: [Sample] = []
              var fxv: BoxFX? = nil      // эффекты (nil в старых проектах)
              var shapev: BoxShape? = nil   // форма (nil = обычная рамка)
              var shape: BoxShape {
                  get { shapev ?? .rect }
                  set { shapev = newValue }
              }
              var handv: HandStyle? = nil   // настройки рисованной дрожи
              var hand: HandStyle {
                  get { handv ?? HandStyle() }
                  set { handv = newValue }
              }
              var fx: BoxFX {
                  get { fxv ?? BoxFX() }
                  set { fxv = newValue }
              }
          }

          struct Music: Codable {
              var file: String
              var name: String
              var dur: Double
              var start = 0.0      // когда начинается на таймлайне
              var inT = 0.0        // с какой секунды трека
              var volume = 1.0
              var fadeIn = 0.0
              var fadeOut = 0.0
          }

          struct ProjectData: Codable {
              var clips: [Clip]
              var boxes: [Box]
              var music: Music?
              var blob: BlobSettings
              var useBlobs: Bool
              var rw: Double
              var rh: Double
          }

          enum Store {
              static var docs: URL {
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
              }
              static var mediaDir: URL {
                  let u = docs.appendingPathComponent("Media")
                  try? FileManager.default.createDirectory(at: u, withIntermediateDirectories: true)
                  return u
              }
              static var projectURL: URL { docs.appendingPathComponent("project.json") }
          }

          enum DetectMode: String, CaseIterable, Identifiable {
              case rects = "Окна / прямоугольники"
              case objects = "Объекты"
              case people = "Люди"
              case faces = "Лица"
              case text = "Текст"
              var id: String { rawValue }
          }

          /// Работа с таймлайном: где какой клип и какая рамка видна в данный момент.
          enum TL {
              struct Loc {
                  let idx: Int
                  let clip: Clip
                  let start: Double   // начало клипа на таймлайне
                  let src: Double     // время в исходном файле
              }

              static func total(_ clips: [Clip]) -> Double {
                  clips.reduce(0) { $0 + $1.dur }
              }

              static func loc(_ clips: [Clip], _ t: Double) -> Loc? {
                  var s = 0.0
                  for (i, c) in clips.enumerated() {
                      if t < s + c.dur || i == clips.count - 1 {
                          let off = min(max(0, t - s), c.dur)
                          return Loc(idx: i, clip: c, start: s, src: c.inT + off)
                      }
                      s += c.dur
                  }
                  return nil
              }

              /// Положение рамки в исходное время st (nil, если рамки там нет).
              static func sample(_ b: Box, _ st: Double) -> Sample? {
                  if st < b.startT - 0.001 { return nil }
                  if let h = b.hideAfter, st > h + 0.0005 { return nil }
                  var lo = 0
                  var hi = b.samples.count - 1
                  var idx = -1
                  while lo <= hi {
                      let m = (lo + hi) / 2
                      if b.samples[m].t <= st + 0.0005 {
                          idx = m
                          lo = m + 1
                      } else {
                          hi = m - 1
                      }
                  }
                  guard idx >= 0 else { return nil }
                  let s = b.samples[idx]
                  guard s.alive, st - s.t < 0.12 else { return nil }
                  return s
              }

              static func items(_ clips: [Clip], _ boxes: [Box], _ t: Double,
                                selected: UUID? = nil, dragged: (id: UUID, rect: CGRect)? = nil) -> [DrawItem] {
                  guard let l = loc(clips, t) else { return [] }
                  var out: [DrawItem] = []
                  for (i, b) in boxes.enumerated() where b.srcID == l.clip.srcID {
                      guard let s = sample(b, l.src) else { continue }
                      var rect = s.rect
                      if let o = dragged, o.id == b.id { rect = o.rect }

                      // когда рамка исчезнет (нужно для анимации исчезновения)
                      var endT = b.hideAfter ?? Double.infinity
                      if let last = b.samples.last {
                          endT = min(endT, last.alive ? last.t + 0.12 : last.t)
                      }

                      var tr: [CGRect] = []
                      if b.fx.has(.trail) {
                          for k in 1...6 {
                              let ts = l.src - Double(k) * 0.05
                              if ts < b.startT { break }
                              if let ps = sample(b, ts) { tr.append(ps.rect) }
                          }
                      }

                      out.append(DrawItem(rect: rect, label: b.label, color: b.color, textColor: b.textColor, seed: i,
                                          fx: b.fx, age: l.src - b.startT, rem: endT - l.src, trail: tr,
                                          selected: b.id == selected, shape: b.shape, hand: b.hand))
                  }
                  return out
              }

              static func blobItems(_ rects: [CGRect], _ s: BlobSettings, time: Double = 0) -> [DrawItem] {
                  let labels = s.labelList
                  var out: [DrawItem] = []
                  for (k, r) in rects.enumerated() {
                      let text = labels.isEmpty ? "" : labels[k % labels.count]
                      out.append(DrawItem(rect: r, label: text, color: s.color, textColor: s.textColor, seed: k,
                                          fx: s.fx, age: time + 5, shape: s.shape, hand: s.hand))
                  }
                  return out
              }
          }

          /// Глюк-текст: всё строчными, а одна случайная буква заглавная.
          /// Буква меняется примерно раз в 0.5 сек (интервал слегка плавает 0.4...0.6).
          /// Результат зависит только от времени и seed, поэтому в видео и в превью одинаковый ритм.
          enum Glitch {
              static let step = 0.5

              private static func mix(_ a: Int, _ b: Int) -> UInt64 {
                  var z = UInt64(truncatingIfNeeded: a) &* 0x9E3779B97F4A7C15
                  z = z &+ UInt64(truncatingIfNeeded: b) &* 0xBF58476D1CE4E5B9
                  z = z &+ 0x94D049BB133111EB
                  z = (z ^ (z >> 30)) &* 0xBF58476D1CE4E5B9
                  z = (z ^ (z >> 27)) &* 0x94D049BB133111EB
                  return z ^ (z >> 31)
              }

              /// Граница k-го отрезка: k * 0.5 плюс сдвиг -0.05...+0.05 (длина отрезка 0.4...0.6).
              private static func boundary(_ k: Int, _ seed: Int) -> Double {
                  let j = Double(mix(k, seed &+ 7919) % 10000) / 10000.0
                  return Double(k) * step + (j - 0.5) * 0.1
              }

              private static func base(_ k: Int, _ seed: Int, _ n: Int) -> Int {
                  Int(mix(k, seed) % UInt64(n))
              }

              static func text(_ s: String, time t: Double, seed: Int) -> String {
                  let chars = Array(s.lowercased())
                  let letters = chars.indices.filter { chars[$0].isLetter }
                  guard !letters.isEmpty else { return String(chars) }

                  var k = Int(floor(t / step))
                  if t < boundary(k, seed) {
                      k -= 1
                  } else if t >= boundary(k + 1, seed) {
                      k += 1
                  }

                  let n = letters.count
                  var pick = base(k, seed, n)
                  if n > 1 {
                      let prev = base(k - 1, seed, n)
                      if pick == prev {
                          pick = (pick + 1 + Int(mix(k, seed &+ 31) % UInt64(n - 1))) % n
                      }
                  }

                  let target = letters[pick]
                  var out = ""
                  for (i, c) in chars.enumerated() {
                      out += (i == target) ? String(c).uppercased() : String(c)
                  }
                  return out
              }
          }

          /// Видео из галереи сразу копируется в Documents/Media, чтобы проект не терял файлы.
          struct VideoFile: Transferable {
              let url: URL

              static var transferRepresentation: some TransferRepresentation {
                  FileRepresentation(contentType: .movie) { video in
                      SentTransferredFile(video.url)
                  } importing: { received in
                      let dest = Store.mediaDir.appendingPathComponent(UUID().uuidString + ".mov")
                      try FileManager.default.copyItem(at: received.file, to: dest)
                      return VideoFile(url: dest)
                  }
              }
          }
          __BT_END__
          cat > Sources/Components.swift <<'__BT_END__'
          import SwiftUI
          import AVFoundation

          /// Подпись в превью: тот же глюк, что потом будет в видео (время берётся с плеера).
          /// Переносится по ширине рамки и стоит над ней (rect в точках, начало слева сверху).
          struct GlitchLabel: View {
              let text: String
              let color: RGB
              let seed: Int
              let rect: CGRect
              let minWidth: CGFloat
              let time: Double

              var body: some View {
                  Color.clear
                      .frame(width: max(rect.width, minWidth), height: max(0, rect.minY))
                      .overlay(alignment: .bottomLeading) {
                          Text(Glitch.text(text, time: time, seed: seed))
                              .font(.system(size: 12, weight: .bold))
                              .foregroundStyle(color.ui)
                              .multilineTextAlignment(.leading)
                              .fixedSize(horizontal: false, vertical: true)
                      }
                      .offset(x: rect.minX)
                      .allowsHitTesting(false)
              }
          }

          /// Быстрые цвета + любой свой через системную палитру.
          struct ColorRow: View {
              let title: String
              @Binding var selection: RGB

              var body: some View {
                  VStack(alignment: .leading, spacing: 6) {
                      Text(title).font(.footnote)
                      HStack(spacing: 8) {
                          ForEach(RGB.presets, id: \.self) { c in
                              Circle()
                                  .fill(c.ui)
                                  .frame(width: 26, height: 26)
                                  .overlay(Circle().stroke(.white, lineWidth: selection == c ? 2 : 0))
                                  .onTapGesture { selection = c }
                          }
                          Spacer(minLength: 0)
                          ColorPicker(
                              "",
                              selection: Binding(
                                  get: { selection.ui },
                                  set: { selection = RGB(color: $0) }
                              ),
                              supportsOpacity: false
                          )
                          .labelsHidden()
                      }
                  }
              }
          }

          final class PlayerUIView: UIView {
              override class var layerClass: AnyClass { AVPlayerLayer.self }
              var playerLayer: AVPlayerLayer { layer as! AVPlayerLayer }
          }

          struct PlayerView: UIViewRepresentable {
              let player: AVPlayer

              func makeUIView(context: Context) -> PlayerUIView {
                  let v = PlayerUIView()
                  v.backgroundColor = .black
                  v.playerLayer.player = player
                  v.playerLayer.videoGravity = .resizeAspect
                  return v
              }

              func updateUIView(_ uiView: PlayerUIView, context: Context) {}
          }
          __BT_END__
          cat > Sources/Detector.swift <<'__BT_END__'
          import Vision
          import CoreGraphics

          enum Detector {
              /// Returns normalized rects (origin bottom-left) found on a single frame.
              static func detect(_ image: CGImage, mode: DetectMode) -> [CGRect] {
                  let handler = VNImageRequestHandler(cgImage: image, options: [:])

                  switch mode {
                  case .rects:
                      let r = VNDetectRectanglesRequest()
                      r.minimumAspectRatio = 0.15
                      r.maximumObservations = 60
                      r.minimumSize = 0.015
                      r.minimumConfidence = 0.4
                      r.quadratureTolerance = 25
                      try? handler.perform([r])
                      return (r.results ?? []).map { $0.boundingBox }

                  case .objects:
                      let r = VNGenerateObjectnessBasedSaliencyImageRequest()
                      try? handler.perform([r])
                      return (r.results?.first?.salientObjects ?? []).map { $0.boundingBox }

                  case .people:
                      let r = VNDetectHumanRectanglesRequest()
                      r.upperBodyOnly = false
                      try? handler.perform([r])
                      return (r.results ?? []).map { $0.boundingBox }

                  case .faces:
                      let r = VNDetectFaceRectanglesRequest()
                      try? handler.perform([r])
                      return (r.results ?? []).map { $0.boundingBox }

                  case .text:
                      let r = VNRecognizeTextRequest()
                      r.recognitionLevel = .fast
                      try? handler.perform([r])
                      return (r.results ?? []).map { $0.boundingBox }
                  }
              }
          }
          __BT_END__
          cat > Sources/Blob.swift <<'__BT_END__'
          import CoreGraphics
          import CoreVideo
          import Foundation

          struct BlobSettings: Equatable, Codable {
              enum Kind: String, CaseIterable, Identifiable, Codable {
                  case color = "По цвету"
                  case bright = "Светлое"
                  case dark = "Тёмное"
                  var id: String { rawValue }
              }

              var kind: Kind = .bright
              var tr: Double = 1.0
              var tg: Double = 0.8
              var tb: Double = 0.2
              var tolerance: Double = 0.25   // 0...1, color distance
              var threshold: Double = 0.75   // 0...1, brightness for bright/dark
              var minArea: Double = 0.002    // fraction of the frame
              var maxBlobs: Int = 15
              var labels: String = ""        // comma separated, assigned in a cycle
              var color: RGB = .red          // box color
              var textColor: RGB = .red      // label color
              var fxv: BoxFX? = nil          // effects (nil in old projects)
              var shapev: BoxShape? = nil    // shape (nil = plain frame)
              var shape: BoxShape {
                  get { shapev ?? .rect }
                  set { shapev = newValue }
              }
              var handv: HandStyle? = nil
              var hand: HandStyle {
                  get { handv ?? HandStyle() }
                  set { handv = newValue }
              }
              var fx: BoxFX {
                  get { fxv ?? BoxFX() }
                  set { fxv = newValue }
              }

              var labelList: [String] {
                  labels.split(separator: ",")
                      .map { $0.trimmingCharacters(in: .whitespaces) }
                      .filter { !$0.isEmpty }
              }
          }

          enum BlobDetector {
              static let smallW = 200

              // MARK: Public API

              /// For every video frame (BGRA pixel buffer). Returns normalized rects, origin bottom-left.
              static func detect(pixelBuffer pb: CVPixelBuffer, settings s: BlobSettings) -> [CGRect] {
                  CVPixelBufferLockBaseAddress(pb, .readOnly)
                  defer { CVPixelBufferUnlockBaseAddress(pb, .readOnly) }
                  guard let base = CVPixelBufferGetBaseAddress(pb) else { return [] }

                  let W = CVPixelBufferGetWidth(pb)
                  let H = CVPixelBufferGetHeight(pb)
                  let bpr = CVPixelBufferGetBytesPerRow(pb)
                  let sw = min(smallW, W)
                  let sh = max(1, sw * H / W)

                  var small = [UInt8](repeating: 0, count: sw * sh * 4)
                  let src = base.assumingMemoryBound(to: UInt8.self)
                  for y in 0..<sh {
                      let py = min(H - 1, y * H / sh)
                      for x in 0..<sw {
                          let px = min(W - 1, x * W / sw)
                          let o = py * bpr + px * 4
                          let d = (y * sw + x) * 4
                          small[d] = src[o]
                          small[d + 1] = src[o + 1]
                          small[d + 2] = src[o + 2]
                      }
                  }
                  return blobs(small, sw, sh, s)
              }

              /// For the preview image.
              static func detect(image: CGImage, settings s: BlobSettings) -> [CGRect] {
                  guard let (px, w, h) = smallBitmap(image) else { return [] }
                  return blobs(px, w, h, s)
              }

              /// Color under a point. nx, ny are normalized with the origin at the TOP-left.
              static func pickColor(image: CGImage, nx: Double, ny: Double) -> (Double, Double, Double)? {
                  guard let (px, w, h) = smallBitmap(image) else { return nil }
                  let cx = min(w - 1, max(0, Int(nx * Double(w))))
                  let cy = min(h - 1, max(0, Int(ny * Double(h))))
                  var r = 0.0, g = 0.0, b = 0.0, n = 0.0
                  for dy in -1...1 {
                      for dx in -1...1 {
                          let x = min(w - 1, max(0, cx + dx))
                          let y = min(h - 1, max(0, cy + dy))
                          let o = (y * w + x) * 4
                          b += Double(px[o])
                          g += Double(px[o + 1])
                          r += Double(px[o + 2])
                          n += 1
                      }
                  }
                  return (r / n / 255, g / n / 255, b / n / 255)
              }

              // MARK: Internals

              private static func smallBitmap(_ image: CGImage) -> ([UInt8], Int, Int)? {
                  let sw = min(smallW, image.width)
                  let sh = max(1, sw * image.height / image.width)
                  var small = [UInt8](repeating: 0, count: sw * sh * 4)
                  let info = CGImageAlphaInfo.premultipliedFirst.rawValue | CGBitmapInfo.byteOrder32Little.rawValue
                  let ok = small.withUnsafeMutableBytes { buf -> Bool in
                      guard let ctx = CGContext(
                          data: buf.baseAddress, width: sw, height: sh, bitsPerComponent: 8,
                          bytesPerRow: sw * 4, space: CGColorSpaceCreateDeviceRGB(), bitmapInfo: info
                      ) else { return false }
                      ctx.draw(image, in: CGRect(x: 0, y: 0, width: sw, height: sh))
                      return true
                  }
                  return ok ? (small, sw, sh) : nil
              }

              /// px is BGRA, rows top to bottom.
              private static func blobs(_ px: [UInt8], _ w: Int, _ h: Int, _ s: BlobSettings) -> [CGRect] {
                  let total = w * h
                  var mask = [Bool](repeating: false, count: total)

                  let maxDist = s.tolerance * 441.67 // 255 * sqrt(3)
                  let maxD2 = maxDist * maxDist
                  let tr = s.tr * 255, tg = s.tg * 255, tb = s.tb * 255
                  let thr = s.threshold * 255

                  for i in 0..<total {
                      let b = Double(px[i * 4])
                      let g = Double(px[i * 4 + 1])
                      let r = Double(px[i * 4 + 2])
                      switch s.kind {
                      case .color:
                          let dr = r - tr, dg = g - tg, db = b - tb
                          mask[i] = dr * dr + dg * dg + db * db <= maxD2
                      case .bright:
                          mask[i] = (0.299 * r + 0.587 * g + 0.114 * b) >= thr
                      case .dark:
                          mask[i] = (0.299 * r + 0.587 * g + 0.114 * b) <= thr
                      }
                  }

                  var seen = [Bool](repeating: false, count: total)
                  var found: [(count: Int, rect: CGRect)] = []
                  var stack: [Int] = []
                  let minPix = max(2, Int(s.minArea * Double(total)))
                  let maxPix = Int(0.5 * Double(total)) // ignore huge regions like the whole sky

                  for start in 0..<total where mask[start] && !seen[start] {
                      seen[start] = true
                      stack.append(start)
                      var count = 0
                      var minX = w, maxX = 0, minY = h, maxY = 0

                      while let i = stack.popLast() {
                          count += 1
                          let x = i % w
                          let y = i / w
                          if x < minX { minX = x }
                          if x > maxX { maxX = x }
                          if y < minY { minY = y }
                          if y > maxY { maxY = y }

                          if x > 0, mask[i - 1], !seen[i - 1] { seen[i - 1] = true; stack.append(i - 1) }
                          if x < w - 1, mask[i + 1], !seen[i + 1] { seen[i + 1] = true; stack.append(i + 1) }
                          if y > 0, mask[i - w], !seen[i - w] { seen[i - w] = true; stack.append(i - w) }
                          if y < h - 1, mask[i + w], !seen[i + w] { seen[i + w] = true; stack.append(i + w) }
                      }

                      if count >= minPix && count <= maxPix {
                          let rect = CGRect(
                              x: CGFloat(minX) / CGFloat(w),
                              y: 1 - CGFloat(maxY + 1) / CGFloat(h),
                              width: CGFloat(maxX - minX + 1) / CGFloat(w),
                              height: CGFloat(maxY - minY + 1) / CGFloat(h))
                          found.append((count, rect))
                      }
                  }

                  found.sort { $0.count > $1.count }
                  return found.prefix(s.maxBlobs).map { $0.rect }
              }
          }
          __BT_END__

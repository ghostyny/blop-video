          import AVFoundation
          import UIKit
          import CoreGraphics
          import CoreVideo

          /// Аутро: рисованный вихрь (8 кадров из спрайта) на последней секунде видео,
          /// а после него 9-й кадр: чистый чёрный, самый последний кадр всего видео.
          enum OutroFX {
              /// Размеры кадров в исходном спрайте (px). Масштаб один на все кадры, без растяжения.
              static let sizes: [(CGFloat, CGFloat)] = [(51, 83), (138, 154), (198, 218), (574, 486),
                                                        (976, 730), (1280, 720), (1280, 720), (1280, 720)]
              static let vortexDur = 1.0   // секунды вихря (8 кадров, резкая смена)
              static let holdDur = 0.8     // сколько держится чёрный кадр в самом конце

              static let frames: [CGImage?] = (1...8).map { (i: Int) -> CGImage? in
                  guard let p = Bundle.main.path(forResource: "outro\(i)", ofType: "png"),
                        let ui = UIImage(contentsOfFile: p) else { return nil }
                  return ui.cgImage
              }

              /// Рисует нужный кадр вихря поверх буфера. time это время кадра, total длина видео.
              static func draw(on pb: CVPixelBuffer, time: Double, total: Double) {
                  let start = max(0, total - vortexDur)
                  guard time >= start else { return }
                  let p = (time - start) / max(0.01, total - start)
                  let idx = min(7, max(0, Int(p * 8)))
                  guard let img = frames[idx] else { return }

                  CVPixelBufferLockBaseAddress(pb, [])
                  defer { CVPixelBufferUnlockBaseAddress(pb, []) }
                  guard let ptr = CVPixelBufferGetBaseAddress(pb) else { return }
                  let w = CVPixelBufferGetWidth(pb)
                  let h = CVPixelBufferGetHeight(pb)
                  let info = CGImageAlphaInfo.premultipliedFirst.rawValue | CGBitmapInfo.byteOrder32Little.rawValue
                  guard let ctx = CGContext(
                      data: ptr, width: w, height: h, bitsPerComponent: 8,
                      bytesPerRow: CVPixelBufferGetBytesPerRow(pb),
                      space: CGColorSpaceCreateDeviceRGB(), bitmapInfo: info
                  ) else { return }

                  let k = max(CGFloat(h) / 720, CGFloat(w) / 1280)
                  let rw = sizes[idx].0 * k
                  let rh = sizes[idx].1 * k
                  ctx.draw(img, in: CGRect(x: (CGFloat(w) - rw) / 2, y: (CGFloat(h) - rh) / 2, width: rw, height: rh))
              }

              /// 9-й кадр: сплошной чёрный.
              static func black(adaptor: AVAssetWriterInputPixelBufferAdaptor, w: Int, h: Int) -> CVPixelBuffer? {
                  var out: CVPixelBuffer?
                  if let pool = adaptor.pixelBufferPool {
                      CVPixelBufferPoolCreatePixelBuffer(nil, pool, &out)
                  }
                  if out == nil {
                      CVPixelBufferCreate(kCFAllocatorDefault, w, h, kCVPixelFormatType_32BGRA, nil, &out)
                  }
                  guard let pb = out else { return nil }
                  CVPixelBufferLockBaseAddress(pb, [])
                  defer { CVPixelBufferUnlockBaseAddress(pb, []) }
                  guard let base = CVPixelBufferGetBaseAddress(pb) else { return nil }
                  let bpr = CVPixelBufferGetBytesPerRow(pb)
                  let H = CVPixelBufferGetHeight(pb)
                  let W = CVPixelBufferGetWidth(pb)
                  let bytes = base.assumingMemoryBound(to: UInt8.self)
                  for y in 0..<H {
                      for x in 0..<W {
                          let o = y * bpr + x * 4
                          bytes[o] = 0
                          bytes[o + 1] = 0
                          bytes[o + 2] = 0
                          bytes[o + 3] = 255
                      }
                  }
                  return pb
              }
          }
          __BT_END__

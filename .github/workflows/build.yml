          import AVFoundation
          import Vision
          import CoreText
          import CoreGraphics
          import AudioToolbox
          import UIKit

          enum ProcError: LocalizedError {
              case noVideo
              case failed(String)

              var errorDescription: String? {
                  switch self {
                  case .noVideo: return "В файле нет видеодорожки"
                  case .failed(let s): return s
                  }
              }
          }

          struct DrawItem {
              var rect: CGRect      // normalized, origin bottom-left
              var label: String
              var color: RGB
              var textColor: RGB
              var seed: Int
              var fx = BoxFX()
              var age = 100.0       // сколько секунд рамка уже живёт
              var rem = 100.0       // сколько секунд ей осталось
              var trail: [CGRect] = []   // прошлые положения для шлейфа (normalized)
              var selected = false
          }

          private func sec(_ s: Double) -> CMTime {
              CMTime(seconds: s, preferredTimescale: 600)
          }

          // MARK: - Tracking of one box

          /// Ведёт одну рамку от кадра к кадру.
          ///  - резкая смена кадра: рамка исчезает;
          ///  - цель потеряна посреди кадра: быстро исчезает;
          ///  - цель уходит через край: рамка скользит дальше и пропадает, когда вышла целиком.
          final class TrackState {
              static let minConfidence: Float = 0.25
              static let lostLimit = 3
              static let cutThreshold = 0.12
              static let edgeMargin: CGFloat = 0.03
              static let minSpeed: CGFloat = 0.0005
              static let maxDriftFrames = 120

              var obs: VNDetectedObjectObservation
              var alive = true
              var rect: CGRect
              var lastGood: CGRect
              var refSize: CGSize
              var vel = CGVector(dx: 0, dy: 0)
              var lost = 0
              var drifting = false
              var driftFrames = 0
              var prevThumb: [UInt8]?
              let seq = VNSequenceRequestHandler()

              init(rect: CGRect) {
                  self.rect = rect
                  self.lastGood = rect
                  self.refSize = rect.size
                  self.obs = VNDetectedObjectObservation(boundingBox: rect)
              }

              func step(_ pb: CVPixelBuffer) {
                  if detectCut(pb) {
                      alive = false
                      return
                  }
                  if drifting {
                      advanceDrift()
                      return
                  }

                  let req = VNTrackObjectRequest(detectedObjectObservation: obs)
                  req.trackingLevel = .accurate
                  do {
                      try seq.perform([req], on: pb, orientation: .up)
                  } catch {
                      return
                  }

                  let o = req.results?.first as? VNDetectedObjectObservation
                  if let o { obs = o }

                  if let o, o.confidence >= Self.minConfidence {
                      let nr = o.boundingBox
                      let dx = nr.midX - rect.midX
                      let dy = nr.midY - rect.midY
                      vel = CGVector(dx: vel.dx * 0.6 + dx * 0.4, dy: vel.dy * 0.6 + dy * 0.4)
                      rect = nr
                      lastGood = nr
                      lost = 0
                      if !touchesEdge(nr) { refSize = nr.size }
                  } else {
                      lost += 1
                      if lost >= Self.lostLimit { lose() }
                  }
              }

              private struct Sides {
                  var left = false
                  var right = false
                  var bottom = false
                  var top = false
                  var any: Bool { left || right || bottom || top }
              }

              private func sides(_ r: CGRect, _ v: CGVector) -> Sides {
                  let m = Self.edgeMargin
                  let s = Self.minSpeed
                  var out = Sides()
                  out.left = r.minX <= m && v.dx < -s
                  out.right = r.maxX >= 1 - m && v.dx > s
                  out.bottom = r.minY <= m && v.dy < -s
                  out.top = r.maxY >= 1 - m && v.dy > s
                  return out
              }

              private func touchesEdge(_ r: CGRect) -> Bool {
                  let m: CGFloat = 0.01
                  return r.minX <= m || r.maxX >= 1 - m || r.minY <= m || r.maxY >= 1 - m
              }

              private func lose() {
                  let v = vel
                  let sd = sides(lastGood, v)
                  guard sd.any else {
                      alive = false
                      return
                  }

                  let n = CGFloat(lost)
                  var r = lastGood.offsetBy(dx: v.dx * n, dy: v.dy * n)

                  let ref = refSize
                  if ref.width > r.width {
                      let nx = sd.left ? r.maxX - ref.width : r.minX
                      r = CGRect(x: nx, y: r.minY, width: ref.width, height: r.height)
                  }
                  if ref.height > r.height {
                      let ny = sd.bottom ? r.maxY - ref.height : r.minY
                      r = CGRect(x: r.minX, y: ny, width: r.width, height: ref.height)
                  }

                  rect = r
                  drifting = true
                  driftFrames = 0
              }

              private func advanceDrift() {
                  rect = rect.offsetBy(dx: vel.dx, dy: vel.dy)
                  driftFrames += 1
                  let r = rect
                  if r.maxX <= 0 || r.minX >= 1 || r.maxY <= 0 || r.minY >= 1
                      || driftFrames > Self.maxDriftFrames {
                      alive = false
                  }
              }

              private func detectCut(_ pb: CVPixelBuffer) -> Bool {
                  let thumb = Self.thumbnail(pb)
                  let prev = prevThumb
                  prevThumb = thumb
                  guard let prev, prev.count == thumb.count, !thumb.isEmpty else { return false }
                  var sum = 0
                  for k in 0..<thumb.count {
                      sum += abs(Int(thumb[k]) - Int(prev[k]))
                  }
                  let mean = Double(sum) / Double(thumb.count) / 255.0
                  return mean > Self.cutThreshold
              }

              private static func thumbnail(_ pb: CVPixelBuffer) -> [UInt8] {
                  CVPixelBufferLockBaseAddress(pb, .readOnly)
                  defer { CVPixelBufferUnlockBaseAddress(pb, .readOnly) }
                  guard let base = CVPixelBufferGetBaseAddress(pb) else { return [] }

                  let W = CVPixelBufferGetWidth(pb)
                  let H = CVPixelBufferGetHeight(pb)
                  let bpr = CVPixelBufferGetBytesPerRow(pb)
                  let gw = 32, gh = 18
                  let src = base.assumingMemoryBound(to: UInt8.self)
                  var out = [UInt8](repeating: 0, count: gw * gh * 3)

                  for gy in 0..<gh {
                      let cy = (gy * 2 + 1) * H / (gh * 2)
                      for gx in 0..<gw {
                          let cx = (gx * 2 + 1) * W / (gw * 2)
                          var sb = 0, sg = 0, sr = 0, n = 0
                          for dy in -2..<2 {
                              for dx in -2..<2 {
                                  let x = min(W - 1, max(0, cx + dx))
                                  let y = min(H - 1, max(0, cy + dy))
                                  let o = y * bpr + x * 4
                                  sb += Int(src[o])
                                  sg += Int(src[o + 1])
                                  sr += Int(src[o + 2])
                                  n += 1
                              }
                          }
                          let d = (gy * gw + gx) * 3
                          out[d] = UInt8(sb / n)
                          out[d + 1] = UInt8(sg / n)
                          out[d + 2] = UInt8(sr / n)
                      }
                  }
                  return out
              }
          }

          /// Прогон трекинга по готовой композиции (кадры уже в формате рендера).
          /// from/to это время на таймлайне, toSource переводит его во время исходного файла.
          enum Tracker {
              static func run(built: Built, from t0: Double, to t1: Double, rect: CGRect,
                              toSource: (Double) -> Double) throws -> [Sample] {
                  let tracks = built.comp.tracks(withMediaType: .video)
                  guard !tracks.isEmpty else { throw ProcError.noVideo }

                  let reader = try AVAssetReader(asset: built.comp)
                  let out = AVAssetReaderVideoCompositionOutput(
                      videoTracks: tracks,
                      videoSettings: [kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32BGRA]
                  )
                  out.videoComposition = built.vcomp
                  reader.timeRange = CMTimeRange(start: sec(t0), end: sec(t1))
                  guard reader.canAdd(out) else { throw ProcError.failed("Не удалось прочитать кадры") }
                  reader.add(out)
                  guard reader.startReading() else {
                      throw reader.error ?? ProcError.failed("Не удалось прочитать кадры")
                  }

                  let st = TrackState(rect: rect)
                  var samples: [Sample] = []
                  while let sb = out.copyNextSampleBuffer() {
                      guard let pb = CMSampleBufferGetImageBuffer(sb) else { continue }
                      let pts = CMSampleBufferGetPresentationTimeStamp(sb).seconds
                      st.step(pb)
                      samples.append(Sample(t: toSource(pts), rect: st.rect, alive: st.alive))
                      if !st.alive { break }
                  }
                  reader.cancelReading()
                  return samples
              }
          }

          // MARK: - Composition

          struct Built {
              let comp: AVMutableComposition
              let vcomp: AVMutableVideoComposition
              let mix: AVAudioMix?
              let duration: Double
          }

          enum Builder {
              static func build(clips: [Clip], music: Music?, render R: CGSize, beeps: [Double] = []) async throws -> Built {
                  let comp = AVMutableComposition()
                  guard let vTrack = comp.addMutableTrack(withMediaType: .video, preferredTrackID: kCMPersistentTrackID_Invalid) else {
                      throw ProcError.failed("Не удалось создать видеодорожку")
                  }
                  var aTrack: AVMutableCompositionTrack?
                  var cursor = CMTime.zero
                  var instrs: [AVMutableVideoCompositionInstruction] = []
                  var fps: Float = 24

                  for c in clips {
                      let asset = AVURLAsset(url: Store.mediaDir.appendingPathComponent(c.file))
                      guard let src = try await asset.loadTracks(withMediaType: .video).first else { continue }

                      let trRange = try await src.load(.timeRange)
                      let avail = min(c.outT, trRange.end.seconds)
                      let d = avail - c.inT
                      guard d > 0.05 else { continue }

                      let range = CMTimeRange(start: sec(c.inT), duration: sec(d))
                      try vTrack.insertTimeRange(range, of: src, at: cursor)

                      if !c.muted, let a = try await asset.loadTracks(withMediaType: .audio).first {
                          if aTrack == nil {
                              aTrack = comp.addMutableTrack(withMediaType: .audio, preferredTrackID: kCMPersistentTrackID_Invalid)
                          }
                          try aTrack?.insertTimeRange(range, of: a, at: cursor)
                      }

                      let n = try await src.load(.naturalSize)
                      let pt = try await src.load(.preferredTransform)
                      let nf = try await src.load(.nominalFrameRate)
                      fps = max(fps, nf)

                      let bb = CGRect(origin: .zero, size: n).applying(pt)
                      let dw = max(1, abs(bb.width))
                      let dh = max(1, abs(bb.height))
                      let s = min(R.width / dw, R.height / dh)
                      var t = pt.concatenating(CGAffineTransform(translationX: -bb.minX, y: -bb.minY))
                      t = t.concatenating(CGAffineTransform(scaleX: s, y: s))
                      t = t.concatenating(CGAffineTransform(translationX: (R.width - dw * s) / 2,
                                                            y: (R.height - dh * s) / 2))

                      let ins = AVMutableVideoCompositionInstruction()
                      ins.timeRange = CMTimeRange(start: cursor, duration: range.duration)
                      let li = AVMutableVideoCompositionLayerInstruction(assetTrack: vTrack)
                      li.setTransform(t, at: cursor)
                      ins.layerInstructions = [li]
                      instrs.append(ins)

                      cursor = cursor + range.duration
                  }

                  guard !instrs.isEmpty else { throw ProcError.failed("Нет клипов с видео") }
                  let total = cursor.seconds

                  // Музыка
                  var mix: AVMutableAudioMix?
                  if let m = music, m.start < total - 0.05 {
                      let ma = AVURLAsset(url: Store.mediaDir.appendingPathComponent(m.file))
                      if let msrc = try await ma.loadTracks(withMediaType: .audio).first,
                         let mt = comp.addMutableTrack(withMediaType: .audio, preferredTrackID: kCMPersistentTrackID_Invalid) {
                          let avail = max(0.1, min(m.dur - m.inT, total - m.start))
                          let range = CMTimeRange(start: sec(m.inT), duration: sec(avail))
                          try mt.insertTimeRange(range, of: msrc, at: sec(m.start))

                          let p = AVMutableAudioMixInputParameters(track: mt)
                          let vol = Float(m.volume)
                          let fi = min(m.fadeIn, avail / 2)
                          let fo = min(m.fadeOut, avail / 2)
                          p.setVolume(fi > 0 ? 0 : vol, at: sec(m.start))
                          if fi > 0 {
                              p.setVolumeRamp(fromStartVolume: 0, toEndVolume: vol,
                                              timeRange: CMTimeRange(start: sec(m.start), duration: sec(fi)))
                          }
                          if fo > 0 {
                              p.setVolumeRamp(fromStartVolume: vol, toEndVolume: 0,
                                              timeRange: CMTimeRange(start: sec(m.start + avail - fo), duration: sec(fo)))
                          }
                          let am = AVMutableAudioMix()
                          am.inputParameters = [p]
                          mix = am
                      }
                  }

                  // Писк при появлении рамок
                  if !beeps.isEmpty, let bu = Beep.ensure() {
                      let ba = AVURLAsset(url: bu)
                      if let bsrc = try await ba.loadTracks(withMediaType: .audio).first,
                         let bt = comp.addMutableTrack(withMediaType: .audio, preferredTrackID: kCMPersistentTrackID_Invalid) {
                          var lastT = -1.0
                          for t in beeps.sorted() where t < total - 0.13 && t - lastT > Beep.duration + 0.01 {
                              try bt.insertTimeRange(CMTimeRange(start: .zero, duration: sec(Beep.duration)), of: bsrc, at: sec(t))
                              lastT = t
                          }
                      }
                  }

                  let vc = AVMutableVideoComposition()
                  vc.instructions = instrs
                  vc.renderSize = R
                  let fpsI = Int32(min(60, max(24, fps.rounded())))
                  vc.frameDuration = CMTime(value: 1, timescale: fpsI)

                  return Built(comp: comp, vcomp: vc, mix: mix, duration: total)
              }
          }

          /// Короткий писк, который ставится на таймлайн в момент появления рамки.
          enum Beep {
              static let duration = 0.12

              static var url: URL {
                  FileManager.default.temporaryDirectory.appendingPathComponent("bt_beep.wav")
              }

              static func ensure() -> URL? {
                  let u = url
                  if FileManager.default.fileExists(atPath: u.path) { return u }
                  let sr = 44100
                  let n = Int(Double(sr) * duration)
                  var d = Data()
                  func u32(_ v: UInt32) { var x = v.littleEndian; d.append(Data(bytes: &x, count: 4)) }
                  func u16(_ v: UInt16) { var x = v.littleEndian; d.append(Data(bytes: &x, count: 2)) }
                  d.append(contentsOf: Array("RIFF".utf8)); u32(UInt32(36 + n * 2)); d.append(contentsOf: Array("WAVE".utf8))
                  d.append(contentsOf: Array("fmt ".utf8)); u32(16); u16(1); u16(1); u32(UInt32(sr)); u32(UInt32(sr * 2)); u16(2); u16(16)
                  d.append(contentsOf: Array("data".utf8)); u32(UInt32(n * 2))
                  for i in 0..<n {
                      let t = Double(i) / Double(sr)
                      let ph = 2 * Double.pi * (1400 * t - 0.5 * (700 / duration) * t * t)
                      let sq = sin(ph) > 0 ? 1.0 : -1.0
                      let v = sq * 0.2 * exp(-t * 25)
                      u16(UInt16(bitPattern: Int16(max(-1, min(1, v)) * 32000)))
                  }
                  do { try d.write(to: u) } catch { return nil }
                  return u
              }
          }

          // MARK: - Overlay drawing

          enum Overlay {
              /// Greedy word wrap. A word longer than maxW stays on its own line.
              static func wrap(_ text: String, _ maxW: CGFloat, _ width: (String) -> CGFloat) -> [String] {
                  var lines: [String] = []
                  var cur = ""
                  for word in text.split(whereSeparator: { $0 == " " || $0 == "\n" }) {
                      let w = String(word)
                      let cand = cur.isEmpty ? w : cur + " " + w
                      if cur.isEmpty || width(cand) <= maxW {
                          cur = cand
                      } else {
                          lines.append(cur)
                          cur = w
                      }
                  }
                  if !cur.isEmpty { lines.append(cur) }
                  return lines.isEmpty ? [text] : lines
              }

              // MARK: Helpers

              /// Детерминированный шум 0..<1: зависит только от чисел, поэтому превью и видео совпадают.
              static func rnd(_ a: Int, _ b: Int) -> Double {
                  var z = UInt64(truncatingIfNeeded: a) &* 0x9E3779B97F4A7C15
                  z = z &+ UInt64(truncatingIfNeeded: b) &* 0xBF58476D1CE4E5B9
                  z = z &+ 0x94D049BB133111EB
                  z = (z ^ (z >> 30)) &* 0xBF58476D1CE4E5B9
                  z = (z ^ (z >> 27)) &* 0x94D049BB133111EB
                  z = z ^ (z >> 31)
                  return Double(z % 100000) / 100000.0
              }

              static func col(_ c: RGB, _ a: CGFloat = 1) -> CGColor {
                  CGColor(red: CGFloat(c.r), green: CGFloat(c.g), blue: CGFloat(c.b), alpha: a)
              }

              static func makeLine(_ s: String, _ font: CTFont, _ color: CGColor) -> CTLine? {
                  let attrs: [CFString: Any] = [
                      kCTFontAttributeName: font,
                      kCTForegroundColorAttributeName: color
                  ]
                  guard let a = CFAttributedStringCreate(nil, s as CFString, attrs as CFDictionary) else { return nil }
                  return CTLineCreateWithAttributedString(a)
              }

              /// Одна строка текста; center = true ставит её центром в точку (x, y).
              static func put(_ ctx: CGContext, _ s: String, font: CTFont, color: CGColor, x: CGFloat, y: CGFloat,
                              center: Bool = false, rot: CGFloat = 0, alpha: CGFloat = 1) {
                  guard let l = makeLine(s, font, color) else { return }
                  let b = CTLineGetBoundsWithOptions(l, [])
                  ctx.saveGState()
                  ctx.setAlpha(alpha)
                  ctx.translateBy(x: x, y: y)
                  ctx.rotate(by: rot)
                  ctx.textMatrix = .identity
                  ctx.textPosition = CGPoint(x: center ? -b.width / 2 - b.minX : 0, y: center ? -b.midY : 0)
                  CTLineDraw(l, ctx)
                  ctx.restoreGState()
              }

              static func strokeFrame(_ ctx: CGContext, _ r: CGRect, color: CGColor, lw: CGFloat,
                                      brackets: Bool, dashed: Bool, time: Double, k: CGFloat) {
                  ctx.saveGState()
                  ctx.setStrokeColor(color)
                  ctx.setLineWidth(lw)
                  if brackets {
                      let L = min(r.width, r.height) * 0.28 * CGFloat(1 + 0.2 * sin(time * 8))
                      let p = CGMutablePath()
                      p.move(to: CGPoint(x: r.minX, y: r.minY + L))
                      p.addLine(to: CGPoint(x: r.minX, y: r.minY))
                      p.addLine(to: CGPoint(x: r.minX + L, y: r.minY))
                      p.move(to: CGPoint(x: r.maxX - L, y: r.minY))
                      p.addLine(to: CGPoint(x: r.maxX, y: r.minY))
                      p.addLine(to: CGPoint(x: r.maxX, y: r.minY + L))
                      p.move(to: CGPoint(x: r.maxX, y: r.maxY - L))
                      p.addLine(to: CGPoint(x: r.maxX, y: r.maxY))
                      p.addLine(to: CGPoint(x: r.maxX - L, y: r.maxY))
                      p.move(to: CGPoint(x: r.minX + L, y: r.maxY))
                      p.addLine(to: CGPoint(x: r.minX, y: r.maxY))
                      p.addLine(to: CGPoint(x: r.minX, y: r.maxY - L))
                      ctx.addPath(p)
                      ctx.strokePath()
                  } else {
                      if dashed {
                          ctx.setLineDash(phase: CGFloat(-time * 50) * k, lengths: [8 * k, 6 * k])
                      }
                      ctx.stroke(r)
                  }
                  ctx.restoreGState()
              }

              static func glowFrame(_ ctx: CGContext, _ r: CGRect, _ it: DrawItem, _ lw: CGFloat,
                                    _ al: CGFloat, _ time: Double, _ k: CGFloat) {
                  ctx.saveGState()
                  ctx.setShadow(offset: .zero, blur: lw * 3, color: col(it.color, al))
                  strokeFrame(ctx, r, color: col(it.color, al), lw: lw,
                              brackets: it.fx.has(.brackets), dashed: it.fx.has(.dashed), time: time, k: k)
                  ctx.restoreGState()
              }

              /// Пикселизация внутри рамки. base это кадр без рамок (нужен, чтобы взять из него цвета).
              static func pixelate(_ ctx: CGContext, _ r: CGRect, W: CGFloat, H: CGFloat,
                                   base: CGImage?, time: Double, k: CGFloat) {
                  let vr = r.intersection(CGRect(x: 0, y: 0, width: W, height: H))
                  if vr.isNull || vr.width < 6 || vr.height < 6 { return }
                  let cell = max(4, 8 * k)
                  let tw = max(1, Int(ceil(vr.width / cell)))
                  let th = max(1, Int(ceil(vr.height / cell)))
                  ctx.saveGState()
                  ctx.clip(to: vr)
                  var done = false
                  if let base {
                      let sx = CGFloat(base.width) / W
                      let sy = CGFloat(base.height) / H
                      let crop = CGRect(x: vr.minX * sx, y: (H - vr.maxY) * sy, width: vr.width * sx, height: vr.height * sy)
                          .integral
                          .intersection(CGRect(x: 0, y: 0, width: base.width, height: base.height))
                      if !crop.isNull, crop.width >= 1, crop.height >= 1, let piece = base.cropping(to: crop) {
                          let info = CGImageAlphaInfo.premultipliedFirst.rawValue | CGBitmapInfo.byteOrder32Little.rawValue
                          if let small = CGContext(data: nil, width: tw, height: th, bitsPerComponent: 8, bytesPerRow: 0,
                                                   space: CGColorSpaceCreateDeviceRGB(), bitmapInfo: info) {
                              small.interpolationQuality = .medium
                              small.draw(piece, in: CGRect(x: 0, y: 0, width: tw, height: th))
                              if let tiny = small.makeImage() {
                                  ctx.interpolationQuality = .none
                                  ctx.draw(tiny, in: vr)
                                  done = true
                              }
                          }
                      }
                  }
                  if !done {
                      // кадра под рукой нет (идёт воспроизведение в превью): рисуем «шум» из квадратов
                      for ry in 0..<th {
                          for cx in 0..<tw {
                              let v = 0.12 + 0.5 * rnd(ry * 1000 + cx, Int(time * 8))
                              ctx.setFillColor(CGColor(gray: CGFloat(v), alpha: 0.9))
                              ctx.fill(CGRect(x: vr.minX + CGFloat(cx) * cell, y: vr.minY + CGFloat(ry) * cell,
                                              width: cell, height: cell))
                          }
                      }
                  }
                  ctx.restoreGState()
              }

              private struct Geo {
                  let it: DrawItem
                  var r: CGRect        // в пикселях, начало слева снизу
                  var vanish: CGFloat  // 0...1, прогресс исчезновения
                  var mode: Int        // вид исчезновения 0, 1 или 2
                  var alpha: CGFloat
                  var bump: CGFloat    // «сомнение»: 0...1
              }

              // MARK: Render

              /// Рисует рамки и все эффекты в готовый контекст (начало слева снизу).
              /// Этот же код рисует и превью, и экспорт, поэтому они совпадают.
              static func render(in ctx: CGContext, W: CGFloat, H: CGFloat, items: [DrawItem],
                                 time: Double, base: CGImage?) {
                  if items.isEmpty { return }
                  let k = W / 360
                  let lw = max(1.5, W * 0.004)
                  let fontSize = max(10, W * 0.032)
                  let stretch: CGFloat = 1.6
                  let font = CTFontCreateWithName("HelveticaNeue-CondensedBold" as CFString, fontSize, nil)
                  let mono = "Menlo-Bold" as CFString

                  // 1. Где рамка на самом деле: сомнение, lock-on и исчезновение двигают и масштабируют её.
                  var geos: [Geo] = []
                  for it in items {
                      let n = it.rect
                      var r = CGRect(x: n.minX * W, y: n.minY * H, width: n.width * W, height: n.height * H)

                      var bump: CGFloat = 0
                      if it.fx.has(.doubt) {
                          let a = it.age + Double(it.seed) * 0.7
                          let ph = a.truncatingRemainder(dividingBy: 2.6)
                          if ph < 0.9 {
                              bump = CGFloat(sin(ph / 0.9 * Double.pi))
                              let dir: CGFloat = (Int(floor(a / 2.6)) % 2 == 0) ? 1 : -1
                              r.origin.x += bump * r.width * 0.9 * dir
                          }
                      }

                      var sc: CGFloat = 1
                      if it.fx.has(.lockOn) {
                          sc = 1 + 1.6 * CGFloat(exp(-6 * it.age) * cos(9 * it.age))
                      }

                      var vanish: CGFloat = 0
                      let mode = abs(it.seed) % 3
                      if it.fx.has(.vanish) && it.rem < 0.5 {
                          vanish = CGFloat(1 - max(0, it.rem) / 0.5)
                      }
                      if vanish > 0 && mode == 0 { sc *= max(0.02, 1 - vanish) }

                      if sc != 1 {
                          let c = CGPoint(x: r.midX, y: r.midY)
                          r = CGRect(x: c.x - r.width * sc / 2, y: c.y - r.height * sc / 2,
                                     width: r.width * sc, height: r.height * sc)
                      }

                      var al: CGFloat = 1
                      if vanish > 0 {
                          if mode == 0 { al = 1 - vanish }
                          if mode == 2 { al = (Int(time * 16) % 2 == 0) ? 1 : 0.15 }
                      }
                      geos.append(Geo(it: it, r: r, vanish: vanish, mode: mode, alpha: al, bump: bump))
                  }

                  // 2. Дождь из «?» на весь кадр
                  if let rainIt = items.first(where: { $0.fx.has(.rainQ) }) {
                      for j in 0..<22 {
                          let sp = CGFloat(60 + rnd(j, 4) * 90) * k
                          let phase = CGFloat(time) * sp + CGFloat(rnd(j, 5)) * H
                          let yDown = phase.truncatingRemainder(dividingBy: H + 30 * k) - 15 * k
                          let x = CGFloat(rnd(j, 3)) * W + CGFloat(sin(time * 3 + Double(j))) * 3 * k
                          let size = CGFloat(10 + rnd(j, 6) * 10) * k
                          put(ctx, "?", font: CTFontCreateWithName(mono, size, nil), color: col(rainIt.textColor),
                              x: x, y: H - yDown, center: true, alpha: 0.4)
                      }
                  }

                  // 3. Spotlight: весь кадр темнее, кроме рамок
                  if items.contains(where: { $0.fx.has(.spot) }) {
                      let path = CGMutablePath()
                      path.addRect(CGRect(x: 0, y: 0, width: W, height: H))
                      for g in geos { path.addRect(g.r) }
                      ctx.saveGState()
                      ctx.setFillColor(CGColor(gray: 0, alpha: 0.62))
                      ctx.addPath(path)
                      ctx.fillPath(using: .evenOdd)
                      ctx.restoreGState()
                  }

                  // 4. Каждая рамка
                  for g in geos {
                      let it = g.it
                      let r = g.r
                      let fx = it.fx
                      let seed = it.seed
                      let al = g.alpha
                      let lineW = it.selected ? lw * 1.6 : lw
                      let squares = g.vanish > 0 && g.mode == 1

                      // шлейф
                      if fx.has(.trail) {
                          for (n, tr) in it.trail.enumerated() {
                              let tr2 = CGRect(x: tr.minX * W, y: tr.minY * H, width: tr.width * W, height: tr.height * H)
                              let a = min(1, 0.55 / CGFloat(n + 1)) * al
                              strokeFrame(ctx, tr2, color: col(it.color, a), lw: lineW,
                                          brackets: fx.has(.brackets), dashed: false, time: time, k: k)
                          }
                      }

                      // пикселизация
                      if fx.has(.pixel) && g.vanish == 0 {
                          pixelate(ctx, r, W: W, H: H, base: base, time: time, k: k)
                      }

                      // сама рамка
                      if squares {
                          ctx.saveGState()
                          ctx.setFillColor(col(it.color, 1 - g.vanish))
                          for n in 0..<16 {
                              let per = CGFloat(n) / 16 * 4
                              let side = Int(per)
                              let f = per - CGFloat(side)
                              let p: CGPoint
                              switch side {
                              case 0: p = CGPoint(x: r.minX + f * r.width, y: r.maxY)
                              case 1: p = CGPoint(x: r.maxX, y: r.maxY - f * r.height)
                              case 2: p = CGPoint(x: r.maxX - f * r.width, y: r.minY)
                              default: p = CGPoint(x: r.minX, y: r.minY + f * r.height)
                              }
                              let dx = p.x - r.midX
                              let dy = p.y - r.midY
                              let d = max(1, hypot(dx, dy))
                              let m = g.vanish * 40 * k * CGFloat(0.5 + rnd(n, seed))
                              let sz = max(0, min(r.width, r.height) / 4 * (1 - g.vanish))
                              let qx = p.x + dx / d * m - sz / 2
                              let qy = p.y + dy / d * m - sz / 2
                              ctx.fill(CGRect(x: qx, y: qy, width: sz, height: sz))
                          }
                          ctx.restoreGState()
                      } else if fx.has(.rgb) {
                          let j = rnd(Int(time * 25), seed)
                          let j2 = rnd(Int(time * 25), seed + 3)
                          let ox = CGFloat(j - 0.5) * 9 * k
                          let oy = CGFloat(j2 - 0.5) * 5 * k
                          strokeFrame(ctx, r.offsetBy(dx: ox, dy: oy), color: col(RGB(1.0, 0.16, 0.23), 0.85 * al),
                                      lw: lineW, brackets: fx.has(.brackets), dashed: fx.has(.dashed), time: time, k: k)
                          strokeFrame(ctx, r.offsetBy(dx: -ox, dy: -oy), color: col(RGB(0.16, 0.42, 1.0), 0.85 * al),
                                      lw: lineW, brackets: fx.has(.brackets), dashed: fx.has(.dashed), time: time, k: k)
                          if rnd(Int(time * 12), seed + 5) > 0.1 {
                              glowFrame(ctx, r, it, lineW, al, time, k)
                          }
                      } else {
                          glowFrame(ctx, r, it, lineW, al, time, k)
                      }

                      // сканирующая линия
                      if fx.has(.scan) && g.vanish == 0 {
                          let ph = CGFloat((time * 0.9 + Double(seed) * 0.3).truncatingRemainder(dividingBy: 1))
                          let sy = r.maxY - ph * r.height
                          ctx.saveGState()
                          ctx.clip(to: r)
                          if let grad = CGGradient(colorsSpace: CGColorSpaceCreateDeviceRGB(),
                                                   colors: [col(it.color, 0), col(it.color, 0.6)] as CFArray,
                                                   locations: [0, 1]) {
                              ctx.drawLinearGradient(grad, start: CGPoint(x: 0, y: sy + 12 * k),
                                                     end: CGPoint(x: 0, y: sy), options: [])
                          }
                          ctx.setFillColor(col(it.color))
                          ctx.fill(CGRect(x: r.minX, y: sy - 0.75 * k, width: r.width, height: 1.5 * k))
                          ctx.restoreGState()
                      }

                      // подпись
                      var text = it.label
                      if g.vanish > 0 && g.mode == 2 {
                          text = "LOST"
                      } else if fx.has(.growQ) {
                          text += String(repeating: "?", count: min(5, 1 + Int(max(0, it.age) / 0.9)))
                      }
                      if !text.isEmpty && !squares {
                          let tcol = col(it.textColor, al)
                          let widthOf: (String) -> CGFloat = { s in
                              guard let l = makeLine(s, font, tcol) else { return 0 }
                              return CTLineGetBoundsWithOptions(l, []).width
                          }
                          let maxW = max(r.width, W * 0.25)
                          let plain = wrap(text.lowercased(), maxW, widthOf)
                          var shown = Glitch.text(plain.joined(separator: "\n"), time: time, seed: seed)
                          if fx.has(.typing) {
                              let n = max(0, Int(it.age * 9))
                              let full = n >= shown.count
                              shown = String(shown.prefix(n))
                              if !full || Int(time * 3) % 2 == 0 { shown += "_" }
                          }
                          let lines = shown.components(separatedBy: "\n")

                          let lineH = fontSize * stretch * 1.05
                          let blockH = CGFloat(lines.count) * lineH
                          let blockW = lines.map(widthOf).max() ?? 0

                          let visible = max(0, min(r.maxX, W) - max(r.minX, 0)) / max(1, r.width)
                          let clampedX = min(max(4, r.minX), max(4, W - blockW - 4))
                          let x = r.minX + (clampedX - r.minX) * min(1, visible)

                          let aboveBase = r.maxY + lineW + 3
                          let below = aboveBase + blockH > H && r.minY - 3 - blockH >= 0

                          ctx.saveGState()
                          ctx.setShadow(offset: .zero, blur: lw * 3, color: col(it.color, al))
                          for (j, s) in lines.enumerated() {
                              let y: CGFloat = below
                                  ? (r.minY - 3) - CGFloat(j + 1) * lineH
                                  : aboveBase + CGFloat(lines.count - 1 - j) * lineH
                              guard let line = makeLine(s, font, tcol) else { continue }
                              ctx.textMatrix = CGAffineTransform(scaleX: 1, y: stretch)
                              ctx.textPosition = CGPoint(x: x, y: y)
                              CTLineDraw(line, ctx)
                          }
                          ctx.restoreGState()
                          ctx.textMatrix = .identity
                      }

                      // служебные данные
                      if fx.has(.data) && g.vanish == 0 {
                          let st = Int(time * 7)
                          let rows = [
                              String(format: "ID %04ld", 427 + (seed * 137) % 9000),
                              String(format: "X %.2f  Y %.2f", Double(r.midX / W), Double(r.midY / H)),
                              String(format: "CONF %.2f", 0.8 + 0.19 * rnd(st, seed))
                          ]
                          let df = CTFontCreateWithName(mono, 9 * k, nil)
                          var top = r.minY - 12 * k
                          if top - 20 * k < 2 { top = r.minY + 32 * k }
                          let dx = max(4, min(r.minX, W - 90 * k))
                          for (n, s) in rows.enumerated() {
                              put(ctx, s, font: df, color: col(it.color, al), x: dx, y: top - CGFloat(n) * 10 * k)
                          }
                      }

                      // вылетающие «?»
                      if fx.has(.flyQ) && g.vanish == 0 {
                          for j in 0..<10 {
                              let per = 1.1 + 0.5 * rnd(j, seed)
                              let ph = (time / per + rnd(j, seed + 9)).truncatingRemainder(dividingBy: 1)
                              let ang = rnd(j, seed + 3) * 2 * Double.pi
                              let reach = CGFloat(ph) * 30 * k
                              let rx = r.width / 2 * 0.9 + reach
                              let ry = r.height / 2 * 0.9 + reach
                              let jx = CGFloat(sin(time * 30 + Double(j))) * 1.5 * k
                              let jy = CGFloat(cos(time * 27 + Double(j))) * 1.5 * k
                              let px = r.midX + CGFloat(cos(ang)) * rx + jx
                              let py = r.midY + CGFloat(sin(ang)) * ry + jy
                              let size = CGFloat(8 + ph * 14) * k
                              put(ctx, "?", font: CTFontCreateWithName(mono, size, nil), color: col(it.textColor),
                                  x: px, y: py, center: true, rot: CGFloat(sin(time * 6 + Double(j)) * 0.4),
                                  alpha: CGFloat(sin(ph * Double.pi)))
                          }
                      }

                      // «?» в кружке на углу
                      if fx.has(.cornerQ) && g.vanish == 0 {
                          let rad = CGFloat(9 + 1.5 * sin(time * 7)) * k
                          ctx.saveGState()
                          ctx.setFillColor(col(it.color))
                          ctx.fillEllipse(in: CGRect(x: r.maxX - rad, y: r.maxY - rad, width: rad * 2, height: rad * 2))
                          ctx.restoreGState()
                          put(ctx, "?", font: CTFontCreateWithName(mono, rad * 1.3, nil), color: CGColor(gray: 0.04, alpha: 1),
                              x: r.maxX, y: r.maxY, center: true, rot: CGFloat(sin(time * 4) * 0.3))
                      }

                      // вспышка «?» в момент сомнения
                      if g.bump > 0.3 {
                          put(ctx, "?", font: CTFontCreateWithName(mono, (16 + 14 * g.bump) * k, nil), color: col(it.textColor),
                              x: r.midX, y: r.maxY + 26 * k, center: true, alpha: g.bump)
                      }
                  }

                  // 5. Линии между рамками с «расстоянием»
                  let linked = geos.filter { $0.it.fx.has(.links) && $0.vanish == 0 }
                  if linked.count >= 2 {
                      let lf = CTFontCreateWithName(mono, 10 * k, nil)
                      for n in 0..<(linked.count - 1) {
                          let a = linked[n]
                          let b = linked[n + 1]
                          ctx.saveGState()
                          ctx.setStrokeColor(col(a.it.color, 0.7))
                          ctx.setLineWidth(max(1, lw * 0.5))
                          ctx.setLineDash(phase: 0, lengths: [4 * k, 4 * k])
                          ctx.move(to: CGPoint(x: a.r.midX, y: a.r.midY))
                          ctx.addLine(to: CGPoint(x: b.r.midX, y: b.r.midY))
                          ctx.strokePath()
                          ctx.restoreGState()
                          let d = Int(hypot(a.r.midX - b.r.midX, a.r.midY - b.r.midY) / W * 1000)
                          put(ctx, "d=\(d)", font: lf, color: col(a.it.color),
                              x: (a.r.midX + b.r.midX) / 2, y: (a.r.midY + b.r.midY) / 2 + 5 * k, center: true)
                      }
                  }
              }

              // MARK: Entry points

              /// Экспорт: рисует прямо в BGRA-буфер кадра.
              static func draw(on pb: CVPixelBuffer, items: [DrawItem], time: Double) {
                  if items.isEmpty { return }
                  CVPixelBufferLockBaseAddress(pb, [])
                  defer { CVPixelBufferUnlockBaseAddress(pb, []) }
                  guard let ptr = CVPixelBufferGetBaseAddress(pb) else { return }

                  let w = CVPixelBufferGetWidth(pb)
                  let h = CVPixelBufferGetHeight(pb)
                  let bitmapInfo = CGImageAlphaInfo.premultipliedFirst.rawValue | CGBitmapInfo.byteOrder32Little.rawValue
                  guard let ctx = CGContext(
                      data: ptr, width: w, height: h, bitsPerComponent: 8,
                      bytesPerRow: CVPixelBufferGetBytesPerRow(pb),
                      space: CGColorSpaceCreateDeviceRGB(), bitmapInfo: bitmapInfo
                  ) else { return }

                  // для пикселизации нужен чистый кадр: снимаем его до того, как что-то нарисовано
                  let snap: CGImage? = items.contains(where: { $0.fx.has(.pixel) }) ? ctx.makeImage() : nil
                  render(in: ctx, W: CGFloat(w), H: CGFloat(h), items: items, time: time, base: snap)
              }

              /// Превью: тот же рисунок в виде прозрачной картинки поверх плеера.
              static func image(items: [DrawItem], size: CGSize, time: Double, base: CGImage?) -> UIImage? {
                  guard !items.isEmpty, size.width > 4, size.height > 4 else { return nil }
                  let f = UIGraphicsImageRendererFormat()
                  f.scale = 2
                  f.opaque = false
                  let renderer = UIGraphicsImageRenderer(size: size, format: f)
                  return renderer.image { rc in
                      let cg = rc.cgContext
                      cg.translateBy(x: 0, y: size.height)
                      cg.scaleBy(x: 1, y: -1)
                      render(in: cg, W: size.width, H: size.height, items: items, time: time, base: base)
                  }
              }
          }

          // MARK: - Export

          final class VideoExporter {
              func run(built: Built, clips: [Clip], boxes: [Box], blobs: BlobSettings?,
                       outro: Bool = false,
                       progress: @escaping (Double) -> Void) async throws -> URL {
                  let comp = built.comp
                  let vTracks = comp.tracks(withMediaType: .video)
                  guard !vTracks.isEmpty else { throw ProcError.noVideo }

                  let evenW = max(2, Int(built.vcomp.renderSize.width) & ~1)
                  let evenH = max(2, Int(built.vcomp.renderSize.height) & ~1)
                  let duration = max(0.001, built.duration)

                  let reader = try AVAssetReader(asset: comp)
                  let vOut = AVAssetReaderVideoCompositionOutput(
                      videoTracks: vTracks,
                      videoSettings: [kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32BGRA]
                  )
                  vOut.videoComposition = built.vcomp
                  reader.add(vOut)

                  var aOut: AVAssetReaderAudioMixOutput?
                  let aTracks = comp.tracks(withMediaType: .audio)
                  if !aTracks.isEmpty {
                      let pcm: [String: Any] = [
                          AVFormatIDKey: kAudioFormatLinearPCM,
                          AVSampleRateKey: 44100,
                          AVNumberOfChannelsKey: 2,
                          AVLinearPCMBitDepthKey: 16,
                          AVLinearPCMIsFloatKey: false,
                          AVLinearPCMIsBigEndianKey: false,
                          AVLinearPCMIsNonInterleaved: false
                      ]
                      let o = AVAssetReaderAudioMixOutput(audioTracks: aTracks, audioSettings: pcm)
                      o.audioMix = built.mix
                      if reader.canAdd(o) { reader.add(o); aOut = o }
                  }

                  let outURL = FileManager.default.temporaryDirectory
                      .appendingPathComponent("edit_\(UUID().uuidString).mp4")
                  try? FileManager.default.removeItem(at: outURL)
                  let writer = try AVAssetWriter(outputURL: outURL, fileType: .mp4)

                  let vIn = AVAssetWriterInput(mediaType: .video, outputSettings: [
                      AVVideoCodecKey: AVVideoCodecType.h264,
                      AVVideoWidthKey: evenW,
                      AVVideoHeightKey: evenH,
                      AVVideoCompressionPropertiesKey: [AVVideoAverageBitRateKey: evenW * evenH * 6]
                  ])
                  vIn.expectsMediaDataInRealTime = false
                  let adaptor = AVAssetWriterInputPixelBufferAdaptor(
                      assetWriterInput: vIn,
                      sourcePixelBufferAttributes: [
                          kCVPixelBufferPixelFormatTypeKey as String: kCVPixelFormatType_32BGRA,
                          kCVPixelBufferWidthKey as String: evenW,
                          kCVPixelBufferHeightKey as String: evenH
                      ]
                  )
                  writer.add(vIn)

                  var aIn: AVAssetWriterInput?
                  if aOut != nil {
                      let i = AVAssetWriterInput(mediaType: .audio, outputSettings: [
                          AVFormatIDKey: kAudioFormatMPEG4AAC,
                          AVNumberOfChannelsKey: 2,
                          AVSampleRateKey: 44100,
                          AVEncoderBitRateKey: 128000
                      ])
                      i.expectsMediaDataInRealTime = false
                      if writer.canAdd(i) { writer.add(i); aIn = i }
                  }

                  let blobsOn = blobs != nil
                  let bs = blobs ?? BlobSettings()

                  return try await withCheckedThrowingContinuation { (cont: CheckedContinuation<URL, Error>) in
                      guard reader.startReading() else {
                          cont.resume(throwing: reader.error ?? ProcError.failed("Не удалось прочитать видео"))
                          return
                      }
                      guard writer.startWriting() else {
                          cont.resume(throwing: writer.error ?? ProcError.failed("Не удалось начать запись"))
                          return
                      }
                      writer.startSession(atSourceTime: .zero)

                      let group = DispatchGroup()
                      var lastReported = 0.0
                      var blackSent = false

                      group.enter()
                      vIn.requestMediaDataWhenReady(on: DispatchQueue(label: "bt.video")) {
                          while vIn.isReadyForMoreMediaData {
                              guard let sb = vOut.copyNextSampleBuffer(),
                                    let pb = CMSampleBufferGetImageBuffer(sb) else {
                                  if outro && !blackSent {
                                      blackSent = true
                                      if let bp = OutroFX.black(adaptor: adaptor, w: evenW, h: evenH) {
                                          _ = adaptor.append(bp, withPresentationTime: sec(duration))
                                      }
                                  }
                                  vIn.markAsFinished()
                                  group.leave()
                                  return
                              }
                              let pts = CMSampleBufferGetPresentationTimeStamp(sb)
                              let t = pts.seconds

                              var items: [DrawItem] = []
                              if blobsOn {
                                  let rects = BlobDetector.detect(pixelBuffer: pb, settings: bs)
                                  items = TL.blobItems(rects, bs, time: t)
                              }
                              items.append(contentsOf: TL.items(clips, boxes, t))
                              Overlay.draw(on: pb, items: items, time: t)
                              if outro { OutroFX.draw(on: pb, time: t, total: duration) }

                              if !adaptor.append(pb, withPresentationTime: pts) {
                                  vIn.markAsFinished()
                                  group.leave()
                                  return
                              }
                              let p = min(1, t / duration)
                              if p - lastReported > 0.01 {
                                  lastReported = p
                                  progress(p)
                              }
                          }
                      }

                      if let aIn, let aOut {
                          group.enter()
                          aIn.requestMediaDataWhenReady(on: DispatchQueue(label: "bt.audio")) {
                              while aIn.isReadyForMoreMediaData {
                                  if let sb = aOut.copyNextSampleBuffer() {
                                      aIn.append(sb)
                                  } else {
                                      aIn.markAsFinished()
                                      group.leave()
                                      return
                                  }
                              }
                          }
                      }

                      group.notify(queue: .global()) {
                          if reader.status == .failed {
                              writer.cancelWriting()
                              cont.resume(throwing: reader.error ?? ProcError.failed("Ошибка чтения"))
                              return
                          }
                          if outro { writer.endSession(atSourceTime: sec(duration + OutroFX.holdDur)) }
                          writer.finishWriting {
                              if writer.status == .completed {
                                  cont.resume(returning: outURL)
                              } else {
                                  cont.resume(throwing: writer.error ?? ProcError.failed("Ошибка записи"))
                              }
                          }
                      }
                  }
              }
          }
          __BT_END__

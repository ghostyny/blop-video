                                  .stroke(Color.white.opacity(0.8), style: StrokeStyle(lineWidth: 1.5, dash: [5]))
                                  .frame(width: r.width, height: r.height)
                                  .offset(x: r.minX, y: r.minY)
                          }

                          // рамки, блобы и все эффекты рисует тот же код, что и экспорт
                          if let img = fxImage(W, H) {
                              Image(uiImage: img)
                                  .resizable()
                                  .frame(width: W, height: H)
                                  .allowsHitTesting(false)
                          }

                          if let sid = ed.selectedBoxID, let v = vis.first(where: { $0.box.id == sid }) {
                              let rect = (overrideID == v.box.id) ? overrideRect : v.rect
                              let r = uiRect(rect, W, H)
                              Circle()
                                  .fill(Color.white)
                                  .frame(width: 18, height: 18)
                                  .position(x: r.maxX, y: r.maxY)
                                  .allowsHitTesting(false)
                          }


          import SwiftUI
          import AVFoundation
          import UIKit

          enum Theme {
              static let bg = Color(red: 0.05, green: 0.05, blue: 0.055)
              static let tile = Color(red: 0.11, green: 0.11, blue: 0.115)
              static let tileStroke = Color.white.opacity(0.09)
              static let panel = Color(red: 0.085, green: 0.085, blue: 0.09)
              static let track = Color(red: 0.13, green: 0.13, blue: 0.135)
              static let accent = Color(red: 0.78, green: 0.95, blue: 0.0)
              static let dim = Color.white.opacity(0.35)
          }

          /// Квадратная кнопка верхней панели.
          struct ChromeButton<Label: View>: View {
              let action: () -> Void
              let label: Label
              @Environment(\.isEnabled) private var isEnabled

              init(action: @escaping () -> Void, @ViewBuilder label: () -> Label) {
                  self.action = action
                  self.label = label()
              }

              var body: some View {
                  Button(action: action) {
                      label
                          .frame(minWidth: 44, minHeight: 44)
                          .background(Theme.tile, in: RoundedRectangle(cornerRadius: 14, style: .continuous))
                          .overlay(RoundedRectangle(cornerRadius: 14, style: .continuous).stroke(Theme.tileStroke, lineWidth: 1))
                          .opacity(isEnabled ? 1 : 0.35)
                  }
                  .buttonStyle(.plain)
              }
          }

          /// Плитка инструмента внизу.
          struct ToolTile: View {
              let icon: String
              let title: String
              var active = false

              var body: some View {
                  VStack(spacing: 7) {
                      Image(systemName: icon)
                          .font(.system(size: 24, weight: .semibold))
                          .frame(height: 28)
                      Text(title)
                          .font(.system(size: 13, weight: .medium))
                          .lineLimit(1)
                  }
                  .foregroundStyle(active ? Theme.accent : Color.white)
                  .frame(width: 96, height: 78)
                  .background(Theme.tile, in: RoundedRectangle(cornerRadius: 20, style: .continuous))
                  .overlay(
                      RoundedRectangle(cornerRadius: 20, style: .continuous)
                          .stroke(active ? Theme.accent.opacity(0.7) : Color.clear, lineWidth: 1.5)
                  )
              }
          }

          /// Таблетка-кнопка внутри панелей настроек.
          struct ChipButtonStyle: ButtonStyle {
              var danger = false
              var selected = false

              func makeBody(configuration: ButtonStyleConfiguration) -> some View {
                  ChipBody(configuration: configuration, danger: danger, selected: selected)
              }

              private struct ChipBody: View {
                  let configuration: ButtonStyleConfiguration
                  let danger: Bool
                  let selected: Bool
                  @Environment(\.isEnabled) private var isEnabled

                  var body: some View {
                      configuration.label
                          .font(.system(size: 14, weight: .semibold))
                          .foregroundStyle(danger ? Color.red : (selected ? Theme.accent : Color.white))
                          .padding(.horizontal, 14)
                          .padding(.vertical, 9)
                          .background(selected ? Theme.accent.opacity(0.18) : Theme.tile, in: Capsule())
                          .overlay(Capsule().stroke(selected ? Theme.accent.opacity(0.7) : Theme.tileStroke, lineWidth: 1))
                          .opacity(!isEnabled ? 0.35 : (configuration.isPressed ? 0.6 : 1))
                  }
              }
          }

          /// Миниатюры кадров для дорожки видео.
          actor Thumbs {
              static let shared = Thumbs()
              private var gens: [String: AVAssetImageGenerator] = [:]
              private var cache: [String: UIImage] = [:]

              func image(file: String, time: Double) async -> UIImage? {
                  let key = "\(file)@\(Int(time * 4))"
                  if let c = cache[key] { return c }
                  let gen: AVAssetImageGenerator
                  if let g = gens[file] {
                      gen = g
                  } else {
                      let g = AVAssetImageGenerator(asset: AVURLAsset(url: Store.mediaDir.appendingPathComponent(file)))
                      g.appliesPreferredTrackTransform = true
                      g.maximumSize = CGSize(width: 180, height: 180)
                      let tol = CMTime(seconds: 0.4, preferredTimescale: 600)
                      g.requestedTimeToleranceBefore = tol
                      g.requestedTimeToleranceAfter = tol
                      gens[file] = g
                      gen = g
                  }
                  guard let res = try? await gen.image(at: CMTime(seconds: max(0, time), preferredTimescale: 600)) else { return nil }
                  let ui = UIImage(cgImage: res.image)
                  if cache.count > 400 { cache.removeAll() }
                  cache[key] = ui
                  return ui
              }
          }

          struct ThumbTile: View {
              let file: String
              let time: Double
              let width: CGFloat
              let height: CGFloat
              @State private var img: UIImage?

              var body: some View {
                  ZStack {
                      Theme.track
                      if let img {
                          Image(uiImage: img)
                              .resizable()
                              .scaledToFill()
                      }
                  }
                  .frame(width: width, height: height)
                  .clipped()
                  .task(id: Int(time * 4)) {
                      img = await Thumbs.shared.image(file: file, time: time)
                  }
              }
          }

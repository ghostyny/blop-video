              private func fxImage(_ W: CGFloat, _ H: CGFloat) -> UIImage? {
                  var items: [DrawItem] = []
                  if ed.useBlobs {
                      items = TL.blobItems(ed.blobRects, ed.blob, time: ed.currentTime)
                  }
                  var ov: (id: UUID, rect: CGRect)? = nil
                  if let oid = overrideID { ov = (id: oid, rect: overrideRect) }
                  items += TL.items(ed.clips, ed.boxes, ed.currentTime, selected: ed.selectedBoxID, dragged: ov)
                  return Overlay.image(items: items, size: CGSize(width: W, height: H),
                                       time: ed.currentTime, base: ed.baseFrame)
              }

              // MARK: - Gestures

              private func area(_ r: CGRect) -> CGFloat { r.width * r.height }

              /// Normalized bottom-left rect -> top-left rect in points.
              private func uiRect(_ r: CGRect, _ W: CGFloat, _ H: CGFloat) -> CGRect {
                  CGRect(x: r.minX * W, y: (1 - r.maxY) * H, width: r.width * W, height: r.height * H)
              }

              private func beginKind(_ p: CGPoint, _ W: CGFloat, _ H: CGFloat) -> DragKind {
                  if ed.useBlobs && panel == .blobs { return .pick }
                  let n = CGPoint(x: p.x / W, y: 1 - p.y / H)
                  let vis = ed.visibleBoxes()

                  if let sid = ed.selectedBoxID, let v = vis.first(where: { $0.box.id == sid }) {
                      let hp = CGPoint(x: v.rect.maxX * W, y: (1 - v.rect.minY) * H)
                      if hypot(p.x - hp.x, p.y - hp.y) < 30 { return .resize(sid, v.rect) }
                  }
                  let hits = vis.filter { $0.rect.contains(n) }
                  if let h = hits.min(by: { area($0.rect) < area($1.rect) }) {
                      ed.selectedBoxID = h.box.id
                      return .move(h.box.id, h.rect)
                  }
                  let props = ed.proposals.filter { $0.contains(n) }
                  if let pr = props.min(by: { area($0) < area($1) }) { return .adopt(pr) }
                  return .draw
              }

              private func dragChanged(_ v: DragGesture.Value, _ W: CGFloat, _ H: CGFloat) {
                  if !dragBegan {
                      dragBegan = true
                      ed.pause()
                      dragKind = beginKind(v.startLocation, W, H)
                  }
                  let moved = hypot(v.translation.width, v.translation.height)
                  let dx = v.translation.width / W
                  let dy = -v.translation.height / H

                  switch dragKind {
                  case .move(let id, let r0):
                      guard moved > 6 else { return }
                      var r = r0.offsetBy(dx: dx, dy: dy)
                      r.origin.x = min(max(0, r.origin.x), 1 - r.width)
                      r.origin.y = min(max(0, r.origin.y), 1 - r.height)
                      overrideID = id
                      overrideRect = r
                  case .resize(let id, let r0):
                      let maxX = min(1, max(r0.minX + 0.02, r0.maxX + dx))
                      let minY = max(0, min(r0.maxY - 0.02, r0.minY + dy))
                      overrideID = id
                      overrideRect = CGRect(x: r0.minX, y: minY, width: maxX - r0.minX, height: r0.maxY - minY)
                  case .draw:
                      if moved > 10 {
                          draft = CGRect(
                              x: min(v.startLocation.x, v.location.x),
                              y: min(v.startLocation.y, v.location.y),
                              width: abs(v.location.x - v.startLocation.x),
                              height: abs(v.location.y - v.startLocation.y))
                      }
                  default:
                      break
                  }
              }

              private func dragEnded(_ v: DragGesture.Value, _ W: CGFloat, _ H: CGFloat) {
                  let moved = hypot(v.translation.width, v.translation.height)
                  switch dragKind {
                  case .move(let id, _), .resize(let id, _):
                      if overrideID == id { ed.commitEdit(id, overrideRect) }
                  case .draw:
                      if let d = draft {
                          let x = max(0, d.minX / W)
                          let w = min(1 - x, d.width / W)
                          let yTop = max(0, d.minY / H)
                          let h = min(1 - yTop, d.height / H)
                          if w > 0.01 && h > 0.01 {
                              ed.addBox(CGRect(x: x, y: 1 - yTop - h, width: w, height: h))
                              panel = .boxes
                          }
                      } else {
                          ed.selectedBoxID = nil
                      }
                  case .adopt(let r):
                      if moved <= 10 {
                          ed.addBox(r)
                          ed.proposals.removeAll { $0 == r }
                          panel = .boxes
                      }
                  case .pick:
                      if moved <= 10 {
                          ed.pickColor(nx: Double(v.location.x / W), ny: Double(v.location.y / H))
                      }
                  case .none:
                      break
                  }
                  dragKind = .none
                  dragBegan = false
                  overrideID = nil
                  draft = nil
              }

